<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>SchooLNext | ระบบตรวจสอบและบันทึกผลการเรียน</title>

    <meta name="description" content="SchooLNext ระบบตรวจสอบและบันทึกผลการเรียน">
    <meta name="theme-color" content="#163a5f">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- PapaParse สำหรับ CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js"></script>

    <style>
        /* =========================================================
           SCHOOLNEXT
           GLOBAL FONT
        ========================================================= */

        @font-face {
            font-family: "TH Sarabun PSK Local";
            src: local("TH Sarabun PSK");
            font-display: swap;
        }

        @font-face {
            font-family: "TH Sarabun PSK Local";
            src: local("TH Sarabun New");
            font-display: swap;
        }

        :root {
            --primary: #163a5f;
            --primary-dark: #102d49;
            --primary-light: #eaf1f8;

            --secondary: #315f86;

            --success: #18794e;
            --success-bg: #eaf7f0;

            --danger: #c62828;
            --danger-bg: #fff0f0;

            --warning: #a56a00;
            --warning-bg: #fff7df;

            --info: #1769aa;
            --info-bg: #edf6ff;

            --text: #243142;
            --text-light: #657386;

            --border: #dfe5ec;
            --border-dark: #cbd3dd;

            --bg: #f5f7fa;
            --card: #ffffff;

            --sidebar-width: 280px;
            --topbar-height: 72px;

            --radius: 12px;
            --radius-small: 8px;

            --shadow: 0 4px 18px rgba(21, 40, 63, 0.07);
            --shadow-large: 0 15px 45px rgba(21, 40, 63, 0.12);

            --transition: 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);

            font-family:
                "TH Sarabun PSK Local",
                "TH Sarabun PSK",
                "TH Sarabun New",
                "Sarabun",
                Arial,
                sans-serif;

            font-size: 20px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        select,
        textarea {
            font-family:
                "TH Sarabun PSK Local",
                "TH Sarabun PSK",
                "TH Sarabun New",
                "Sarabun",
                Arial,
                sans-serif;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        /* =========================================================
           UTILITY
        ========================================================= */

        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .text-muted {
            color: var(--text-light);
        }

        .text-danger {
            color: var(--danger);
        }

        .text-success {
            color: var(--success);
        }

        .mt-1 {
            margin-top: 8px;
        }

        .mt-2 {
            margin-top: 16px;
        }

        .mt-3 {
            margin-top: 24px;
        }

        .mb-1 {
            margin-bottom: 8px;
        }

        .mb-2 {
            margin-bottom: 16px;
        }

        .mb-3 {
            margin-bottom: 24px;
        }

        /* =========================================================
           LOADING SCREEN
        ========================================================= */

        #initialLoader {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #f6f8fb 0%,
                    #edf2f7 50%,
                    #f8fafc 100%
                );
        }

        .initial-loader-box {
            width: min(420px, calc(100% - 40px));
            padding: 40px 30px;
            text-align: center;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-large);
        }

        .initial-loader-logo {
            width: 74px;
            height: 74px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background: var(--primary);
            border-radius: 18px;

            font-size: 35px;
            box-shadow: 0 10px 25px rgba(22, 58, 95, 0.2);
        }

        .initial-loader-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .initial-loader-subtitle {
            margin-top: 4px;
            color: var(--text-light);
            font-size: 20px;
        }

        .initial-loader-spinner {
            width: 36px;
            height: 36px;
            margin: 24px auto 0;

            border: 4px solid #dce5ee;
            border-top-color: var(--primary);
            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           LOGIN
        ========================================================= */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 18px;

            background:
                linear-gradient(
                    135deg,
                    #f2f5f8 0%,
                    #e9eef4 45%,
                    #f7f9fb 100%
                );
        }

        .login-wrapper {
            width: min(450px, 100%);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .login-logo {
            width: 84px;
            height: 84px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--primary);
            color: #ffffff;

            border-radius: 22px;
            box-shadow: 0 14px 35px rgba(22, 58, 95, 0.2);

            font-size: 40px;
        }

        .login-brand h1 {
            color: var(--primary);
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
        }

        .login-brand p {
            margin-top: 6px;
            color: var(--text-light);
            font-size: 21px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-large);
            overflow: hidden;
        }

        .login-card-header {
            padding: 25px 28px 20px;
            border-bottom: 1px solid var(--border);
        }

        .login-card-header h2 {
            font-size: 27px;
            color: var(--text);
        }

        .login-card-header p {
            margin-top: 3px;
            color: var(--text-light);
            font-size: 18px;
        }

        .login-card-body {
            padding: 26px 28px 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            color: var(--text);
            font-size: 20px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);

            color: #7d8997;
            pointer-events: none;
        }

        .input-wrapper input,
        .input-wrapper select,
        .input-wrapper textarea {
            width: 100%;
        }

        .form-control {
            width: 100%;
            min-height: 46px;

            padding: 9px 14px;

            color: var(--text);
            background: #ffffff;

            border: 1px solid var(--border-dark);
            border-radius: var(--radius-small);

            outline: none;
            font-size: 20px;

            transition: var(--transition);
        }

        .input-wrapper .form-control {
            padding-left: 43px;
        }

        .password-toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);

            border: 0;
            background: transparent;
            color: #7d8997;

            font-size: 18px;
            padding: 5px;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 58, 95, 0.1);
        }

        textarea.form-control {
            min-height: 110px;
            resize: vertical;
        }

        select.form-control {
            appearance: auto;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 8px 0 20px;
            color: var(--text-light);
            font-size: 18px;
        }

        .remember-row input {
            width: 17px;
            height: 17px;
            accent-color: var(--primary);
        }

        .btn {
            min-height: 44px;
            padding: 8px 17px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border: 1px solid transparent;
            border-radius: var(--radius-small);

            font-size: 20px;
            font-weight: 700;

            transition: var(--transition);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .btn-primary {
            color: #ffffff;
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .btn-secondary {
            color: var(--primary);
            background: #ffffff;
            border-color: var(--border-dark);
        }

        .btn-secondary:hover:not(:disabled) {
            background: #f5f8fb;
            border-color: var(--primary);
        }

        .btn-success {
            color: #ffffff;
            background: var(--success);
            border-color: var(--success);
        }

        .btn-danger {
            color: #ffffff;
            background: var(--danger);
            border-color: var(--danger);
        }

        .btn-warning {
            color: #ffffff;
            background: #9a6500;
            border-color: #9a6500;
        }

        .btn-info {
            color: #ffffff;
            background: var(--info);
            border-color: var(--info);
        }

        .btn-sm {
            min-height: 36px;
            padding: 5px 12px;
            font-size: 17px;
        }

        .btn-block {
            width: 100%;
        }

        .login-footer {
            text-align: center;
            padding-top: 20px;
            color: #7a8795;
            font-size: 16px;
        }

        /* =========================================================
           APPLICATION
        ========================================================= */

        #app {
            min-height: 100vh;
        }

        .app-layout {
            min-height: 100vh;
            display: flex;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            position: fixed;
            z-index: 1000;

            left: 0;
            top: 0;
            bottom: 0;

            width: var(--sidebar-width);

            display: flex;
            flex-direction: column;

            background: #ffffff;
            border-right: 1px solid var(--border);

            transition:
                transform var(--transition),
                width var(--transition);
        }

        .sidebar-brand {
            min-height: var(--topbar-height);

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 13px 20px;

            border-bottom: 1px solid var(--border);
        }

        .sidebar-logo {
            width: 43px;
            height: 43px;
            flex: 0 0 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background: var(--primary);
            border-radius: 11px;

            font-size: 21px;
        }

        .sidebar-brand-text {
            min-width: 0;
        }

        .sidebar-brand-title {
            color: var(--primary);
            font-size: 25px;
            font-weight: 700;
            line-height: 1;
        }

        .sidebar-brand-subtitle {
            color: var(--text-light);
            font-size: 15px;
            white-space: nowrap;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px 11px;
        }

        .nav-section-title {
            padding: 9px 12px 5px;

            color: #8995a3;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .nav-item {
            width: 100%;
            min-height: 43px;

            display: flex;
            align-items: center;
            gap: 11px;

            padding: 8px 13px;
            margin: 2px 0;

            border: 0;
            border-radius: 9px;

            color: #4f5e6d;
            background: transparent;

            font-size: 19px;
            text-align: left;

            transition: var(--transition);
        }

        .nav-item i {
            width: 22px;
            text-align: center;
            font-size: 17px;
        }

        .nav-item:hover {
            color: var(--primary);
            background: #f2f6fa;
        }

        .nav-item.active {
            color: var(--primary);
            background: var(--primary-light);
            font-weight: 700;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 9px 10px;
            margin-bottom: 8px;

            background: #f7f9fb;
            border-radius: 9px;
        }

        .sidebar-user-avatar {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background: var(--primary);
            border-radius: 50%;

            font-size: 17px;
        }

        .sidebar-user-info {
            min-width: 0;
        }

        .sidebar-user-name {
            font-weight: 700;
            font-size: 18px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-user-role {
            color: var(--text-light);
            font-size: 15px;
        }

        /* =========================================================
           MAIN
        ========================================================= */

        .main-wrapper {
            width: calc(100% - var(--sidebar-width));
            margin-left: var(--sidebar-width);
            min-width: 0;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 900;

            height: var(--topbar-height);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            background: rgba(255,255,255,0.97);
            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(12px);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .mobile-menu-btn {
            display: none;
            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            background: #ffffff;
            border-radius: 9px;

            color: var(--primary);
            font-size: 20px;
        }

        .page-heading {
            min-width: 0;
        }

        .page-heading h1 {
            font-size: 27px;
            color: var(--primary);
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .page-heading p {
            margin-top: 2px;
            color: var(--text-light);
            font-size: 16px;
            white-space: nowrap;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .system-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 6px 11px;

            color: var(--success);
            background: var(--success-bg);
            border-radius: 20px;

            font-size: 16px;
        }

        .system-status i {
            font-size: 9px;
        }

        .content {
            padding: 25px;
        }

        /* =========================================================
           PAGE / CARDS
        ========================================================= */

        .page {
            animation: pageFade 0.18s ease;
        }

        @keyframes pageFade {
            from {
                opacity: 0;
                transform: translateY(3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 20px;
        }

        .page-title h2 {
            color: var(--text);
            font-size: 29px;
        }

        .page-title p {
            margin-top: 2px;
            color: var(--text-light);
            font-size: 18px;
        }

        .page-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .card-header {
            padding: 16px 19px;
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;
        }

        .card-header h3 {
            font-size: 23px;
            color: var(--text);
        }

        .card-header p {
            margin-top: 2px;
            color: var(--text-light);
            font-size: 16px;
        }

        .card-body {
            padding: 19px;
        }

        .card-footer {
            padding: 14px 19px;
            border-top: 1px solid var(--border);
        }

        /* =========================================================
           DASHBOARD STATS
        ========================================================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            padding: 18px;

            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);

            display: flex;
            align-items: center;
            gap: 13px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            flex: 0 0 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--primary);
            background: var(--primary-light);

            border-radius: 12px;
            font-size: 21px;
        }

        .stat-value {
            font-size: 29px;
            font-weight: 700;
            line-height: 1;
        }

        .stat-label {
            color: var(--text-light);
            font-size: 17px;
            margin-top: 3px;
        }

        /* =========================================================
           TOOLBAR
        ========================================================= */

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;

            padding: 13px;

            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;

            margin-bottom: 15px;
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            min-width: 240px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);

            color: #8894a2;
        }

        .search-box input {
            min-height: 42px;
            padding: 7px 12px 7px 37px;

            border: 1px solid var(--border-dark);
            border-radius: 8px;

            background: #ffffff;
            color: var(--text);

            outline: none;
            font-size: 18px;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        /* =========================================================
           GRID / FORM
        ========================================================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 14px;
        }

        .col-12 {
            grid-column: span 12;
        }

        .col-8 {
            grid-column: span 8;
        }

        .col-6 {
            grid-column: span 6;
        }

        .col-4 {
            grid-column: span 4;
        }

        .col-3 {
            grid-column: span 3;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 18px;
            font-weight: 700;
        }

        .field small {
            display: block;
            margin-top: 4px;
            color: var(--text-light);
            font-size: 15px;
        }

        /* =========================================================
           TABLE
        ========================================================= */

        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 9px;
        }

        .data-table {
            min-width: 800px;
        }

        .data-table thead th {
            padding: 10px 11px;

            background: #f1f5f8;
            color: #3f4d5c;

            border-bottom: 1px solid var(--border-dark);

            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
        }

        .data-table tbody td {
            padding: 9px 11px;

            border-bottom: 1px solid #edf0f3;

            font-size: 18px;
            vertical-align: middle;
        }

        .data-table tbody tr:hover {
            background: #fafcfe;
        }

        .data-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .data-table input,
        .data-table select {
            min-height: 36px;
            padding: 5px 8px;

            border: 1px solid var(--border-dark);
            border-radius: 6px;

            background: #ffffff;

            font-size: 17px;
            outline: none;
        }

        .data-table input:focus,
        .data-table select:focus {
            border-color: var(--primary);
        }

        .score-input {
            width: 85px;
            text-align: center;
        }

        .score-low {
            background: #fff0f0 !important;
            color: #a51f1f;
            border-color: #efb1b1 !important;
        }

        .score-disabled {
            background: #eef1f4 !important;
            color: #8b95a1 !important;
            cursor: not-allowed;
        }

        /* =========================================================
           BADGES
        ========================================================= */

        .badge {
            display: inline-flex;
            align-items: center;

            min-height: 27px;
            padding: 3px 9px;

            border-radius: 20px;

            font-size: 15px;
            font-weight: 700;
        }

        .badge-primary {
            color: var(--primary);
            background: var(--primary-light);
        }

        .badge-success {
            color: var(--success);
            background: var(--success-bg);
        }

        .badge-danger {
            color: var(--danger);
            background: var(--danger-bg);
        }

        .badge-warning {
            color: var(--warning);

<script>
"use strict";

/* ================================================================
   SCHOOLNEXT FRONTEND
   ================================================================ */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwvhaqM3omMeSUgSqFyBNNjh48tzIWX8fdTTynt3r0dL8g7SSKcRDdtX5AZVObeh3tFYA/exec";


const STORAGE_SESSION = "schooLNextSession";
const STORAGE_REMEMBER = "schooLNextRemember";


const AppState = {
    session: null,
    user: null,
    permissions: {},
    currentPage: "",
    data: {},
    cache: {},
    initialized: false,
    loading: false
};


/* ================================================================
   DOM HELPERS
   ================================================================ */

function $(selector) {
    return document.querySelector(selector);
}


function $$(selector) {
    return Array.from(document.querySelectorAll(selector));
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function toNumber(value, fallback = 0) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : fallback;
}


function formatNumber(value, decimals = 2) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "-";
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return String(value);
    }

    return number.toLocaleString("th-TH", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
    });
}


function formatDateTime(value) {

    if (!value) {
        return "-";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return String(value);
    }

    return date.toLocaleString("th-TH", {
        dateStyle: "short",
        timeStyle: "short"
    });
}


function normalizeArray(value) {

    if (Array.isArray(value)) {
        return value;
    }

    if (
        value &&
        Array.isArray(value.items)
    ) {
        return value.items;
    }

    if (
        value &&
        Array.isArray(value.rows)
    ) {
        return value.rows;
    }

    if (
        value &&
        Array.isArray(value.data)
    ) {
        return value.data;
    }

    return [];
}


function getObjectValue(object, keys, fallback = "") {

    if (!object || typeof object !== "object") {
        return fallback;
    }

    for (const key of keys) {

        if (
            object[key] !== undefined &&
            object[key] !== null
        ) {
            return object[key];
        }

    }

    return fallback;
}


/* ================================================================
   SWEETALERT
   ================================================================ */

/* ================================================================
   API LOADING
   ================================================================ */

function setLoading(active, text = "กำลังประมวลผล") {

    const element = $("#apiLoading");

    if (!element) {
        return;
    }

    $("#apiLoadingText").textContent = text;

    if (active) {
        element.classList.add("active");
    } else {
        element.classList.remove("active");
    }

    AppState.loading = active;
}


/* ================================================================
   API RESPONSE PARSER
   ================================================================ */

async function parseApiResponse(response) {

    const rawText = await response.text();

    if (!rawText) {
        throw new Error(
            "เซิร์ฟเวอร์ไม่ส่งข้อมูลกลับมา"
        );
    }

    let cleaned = rawText.trim();

    /*
     * Google Apps Script บางกรณีอาจส่ง JSON
     * ที่มีข้อความหรือ whitespace ติดมาด้านหน้า
     */
    const firstBrace = cleaned.indexOf("{");
    const firstBracket = cleaned.indexOf("[");

    let jsonStart = -1;

    if (
        firstBrace >= 0 &&
        firstBracket >= 0
    ) {
        jsonStart = Math.min(
            firstBrace,
            firstBracket
        );
    } else if (firstBrace >= 0) {
        jsonStart = firstBrace;
    } else if (firstBracket >= 0) {
        jsonStart = firstBracket;
    }

    if (jsonStart > 0) {
        cleaned = cleaned.substring(jsonStart);
    }

    try {

        const parsed = JSON.parse(cleaned);

        return parsed;

    } catch (error) {

        /*
         * หาก Google Apps Script ตอบ HTML
         * จะไม่ปล่อย error แบบกำกวมอีกต่อไป
         */
        if (
            cleaned.includes("<html") ||
            cleaned.includes("<!DOCTYPE") ||
            cleaned.includes("<!doctype")
        ) {

            throw new Error(
                "เซิร์ฟเวอร์ส่งหน้า HTML กลับมาแทน JSON กรุณาตรวจสอบการ Deploy ของ Code.gs ให้เป็น Web App และตรวจสอบ doPost(e)"
            );
        }

        throw new Error(
            "เซิร์ฟเวอร์ส่งข้อมูลกลับมาไม่ใช่ JSON"
            + "\nข้อมูลที่ได้รับ: "
            + cleaned.substring(0, 500)
        );
    }
}


/* ================================================================
   API REQUEST
   ================================================================ */

async function apiRequest(
    action,
    data = {},
    options = {}
) {

    const token =
        AppState.session?.token ||
        data.token ||
        "";

    const payload = {
        action: action,
        token: token,
        data: data,

        /*
         * ส่งข้อมูลซ้ำในระดับบนด้วย
         * เพื่อรองรับ Code.gs ที่อ่าน params โดยตรง
         */
        ...data
    };

    if (token) {
        payload.token = token;
    }

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            options.timeout || 30000
        );

    try {

        const response = await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body: JSON.stringify(payload),

                signal: controller.signal,

                redirect: "follow"
            }
        );

        const result =
            await parseApiResponse(response);

        if (
            result === null ||
            result === undefined
        ) {
            throw new Error(
                "เซิร์ฟเวอร์ไม่ส่งข้อมูลกลับมา"
            );
        }

        if (
            result.success === false
        ) {

            const message =
                result.message ||
                result.error ||
                "ไม่สามารถดำเนินการได้";

            const error =
                new Error(message);

            error.apiResponse = result;

            throw error;
        }

        return result;

    } catch (error) {

        if (
            error.name === "AbortError"
        ) {

            throw new Error(
                "การเชื่อมต่อใช้เวลานานเกินไป กรุณาตรวจสอบ Apps Script และอินเทอร์เน็ต"
            );
        }

        throw error;

    } finally {

        clearTimeout(timeout);
    }
}


/* ================================================================
   DATA EXTRACTION
   ================================================================ */

function extractData(response) {

    if (!response) {
        return {};
    }

    if (
        response.data !== undefined
    ) {
        return response.data;
    }

    return response;
}


function extractRows(response) {

    const data =
        extractData(response);

    if (Array.isArray(data)) {
        return data;
    }

    if (
        data &&
        Array.isArray(data.rows)
    ) {
        return data.rows;
    }

    if (
        data &&
        Array.isArray(data.items)
    ) {
        return data.items;
    }

    if (
        data &&
        Array.isArray(data.results)
    ) {
        return data.results;
    }

    return [];
}


/* ================================================================
   SESSION
   ================================================================ */

function saveSession(session) {

    AppState.session = session;

    if (session?.user) {
        AppState.user = session.user;
    }

    if (session?.permissions) {
        AppState.permissions =
            session.permissions;
    }

    const remember =
        localStorage.getItem(
            STORAGE_REMEMBER
        ) === "true";

    if (remember) {

        localStorage.setItem(
            STORAGE_SESSION,
            JSON.stringify(session)
        );

    } else {

        sessionStorage.setItem(
            STORAGE_SESSION,
            JSON.stringify(session)
        );
    }
}


function loadStoredSession() {

    const local =
        localStorage.getItem(
            STORAGE_SESSION
        );

    if (local) {

        try {
            return JSON.parse(local);
        } catch (error) {
            localStorage.removeItem(
                STORAGE_SESSION
            );
        }
    }

    const session =
        sessionStorage.getItem(
            STORAGE_SESSION
        );

    if (session) {

        try {
            return JSON.parse(session);
        } catch (error) {
            sessionStorage.removeItem(
                STORAGE_SESSION
            );
        }
    }

    return null;
}


function clearSession() {

    AppState.session = null;
    AppState.user = null;
    AppState.permissions = {};
    AppState.cache = {};

    localStorage.removeItem(
        STORAGE_SESSION
    );

    sessionStorage.removeItem(
        STORAGE_SESSION
    );
}


async function performLogout() {

    try {

        if (AppState.session?.token) {

            await apiRequest(
                "logout",
                {
                    token:
                        AppState.session.token
                },
                {
                    timeout: 10000
                }
            );
        }

    } catch (error) {
        console.warn(
            "Logout API:",
            error
        );
    }

    clearSession();

    showLoginScreen();

    $("#loginUsername").value = "";
    $("#loginPassword").value = "";

    await swalInfo(
        "ออกจากระบบแล้ว"
    );
}


/* ================================================================
   LOGIN
   ================================================================ */

async function login(username, password, remember) {

    const button =
        $("#loginButton");

    button.disabled = true;

    button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ';

    setLoading(
        true,
        "กำลังตรวจสอบข้อมูลเข้าสู่ระบบ"
    );

    try {

        const response =
            await apiRequest(
                "login",
                {
                    username: username,
                    password: password
                },
                {
                    timeout: 30000
                }
            );

        const data =
            extractData(response);

        let session;

        if (
            data &&
            data.token
        ) {

            session = {
                token: data.token,
                user:
                    data.user ||
                    response.user ||
                    {},
                permissions:
                    data.permissions ||
                    response.permissions ||
                    {}
            };

        } else if (
            response.token
        ) {

            session = {
                token: response.token,
                user:
                    response.user ||
                    {},
                permissions:
                    response.permissions ||
                    {}
            };

        } else {

            throw new Error(
                "เข้าสู่ระบบสำเร็จแต่เซิร์ฟเวอร์ไม่ส่ง Session Token กลับมา"
            );
        }

        localStorage.setItem(
            STORAGE_REMEMBER,
            remember
                ? "true"
                : "false"
        );

        saveSession(session);

        hideLoginScreen();
        showApp();

        await loadDashboard();

        await swalSuccess(
            "เข้าสู่ระบบสำเร็จ",
            "ยินดีต้อนรับเข้าสู่ SchooLNext"
        );

    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );

        await swalError(
            "เข้าสู่ระบบไม่สำเร็จ",
            error.message ||
            "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        );

    } finally {

        button.disabled = false;

        button.innerHTML =
            '<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ';

        setLoading(false);
    }
}

function showLoginScreen() {

        .classList.add("hidden");

    $("#app")
        .classList.add("hidden");

    $("#loginScreen")
        .classList.remove("hidden");
}


function hideLoginScreen() {

    $("#loginScreen")
        .classList.add("hidden");
}


function showApp() {

    $("#initialLoader")
        .classList.add("hidden");

    $("#loginScreen")
        .classList.add("hidden");

    $("#app")
        .classList.remove("hidden");

    renderSidebar();

    updateUserInformation();
}


function updateUserInformation() {

    const user =
        AppState.user || {};

    const name =
        getObjectValue(
            user,
            [
                "name",
                "fullName",
                "displayName",
                "username"
            ],
            "ผู้ใช้งาน"
        );

    const role =
        getObjectValue(
            user,
            [
                "roleName",
                "role",
                "userRole"
            ],
            "ผู้ใช้งาน"
        );

    $("#sidebarUserName")
        .textContent = name;

    $("#sidebarUserRole")
        .textContent =
            roleLabel(role);

    const avatar =
        $("#sidebarAvatar");

    avatar.innerHTML =
        '<i class="fa-solid fa-user"></i>';
}


function roleLabel(role) {

    const normalized =
        String(role || "")
            .toLowerCase();

    if (
        normalized.includes("manager") ||
        normalized.includes("admin") ||
        normalized.includes("ผู้จัดการ") ||
        normalized.includes("ผู้ดูแล")
    ) {
        return "ผู้จัดการระบบ";
    }

    if (
        normalized.includes("teacher") ||
        normalized.includes("ครู")
    ) {
        return "ครูผู้สอน";
    }

    if (
        normalized.includes("student") ||
        normalized.includes("นักเรียน")
    ) {
        return "นักเรียน";
    }

    return role || "ผู้ใช้งาน";
}


/* ================================================================
   ROLE
   ================================================================ */

function getUserRole() {

    const user =
        AppState.user || {};

    return String(
        getObjectValue(
            user,
            [
                "role",
                "userRole",
                "roleName"
            ],
            ""
        )
    ).toLowerCase();
}


function isManager() {

    const role =
        getUserRole();

    return (
        role.includes("manager") ||
        role.includes("admin") ||
        role.includes("ผู้จัดการ") ||
        role.includes("ผู้ดูแล")
    );
}


function isTeacher() {

    const role =
        getUserRole();

    return (
        role.includes("teacher") ||
        role.includes("ครู")
    );
}


function isStudent() {

    const role =
        getUserRole();

    return (
        role.includes("student") ||
        role.includes("นักเรียน")
    );
}

async function saveSubject(event) {

    event.preventDefault();

    const id =
        $("#subjectId").value.trim();

    const payload = {

        operation:
            id
                ? "update"
                : "create",

        mode:
            id
                ? "update"
                : "create",

        id: id,

        subjectId: id,

        subjectCode:
            $("#subjectCode").value.trim(),

        code:
            $("#subjectCode").value.trim(),

        subjectName:
            $("#subjectName").value.trim(),

        name:
            $("#subjectName").value.trim(),

        category:
            $("#subjectCategory").value,

        credits:
            toNumber(
                $("#subjectCredits").value
            ),

        gradeLevel:
            $("#subjectGradeLevel").value.trim(),

        room:
            $("#subjectRoom").value.trim()
    };


    setLoading(
        true,
        "กำลังบันทึกข้อมูลรายวิชา"
    );

    try {

        await apiRequest(
            "subjects",
            payload
        );

        closeModal();

        await swalSuccess(
            id
                ? "แก้ไขรายวิชาเรียบร้อยแล้ว"
                : "เพิ่มรายวิชาเรียบร้อยแล้ว"
        );

        await loadSubjectsPage();

    } catch (error) {

        await swalError(
            "ไม่สามารถบันทึกรายวิชา",
            error.message
        );

    } finally {

        setLoading(false);
    }
}


async function deleteSubject(id) {

    if (!id) {
        await swalError(
            "ไม่พบรหัสรายวิชา"
        );
        return;
    }


    const result =
        await Swal.fire({
            icon: "warning",
            title: "ยืนยันการลบรายวิชา",
            text: "ข้อมูลรายวิชาที่ลบแล้วอาจไม่สามารถกู้คืนได้",
            showCancelButton: true,
            confirmButtonText: "ยืนยันลบ",
            cancelButtonText: "ยกเลิก",
            confirmButtonColor: "#c62828"
        });


    if (!result.isConfirmed) {
        return;
    }


    setLoading(
        true,
        "กำลังลบรายวิชา"
    );

    try {

        await apiRequest(
            "subjects",
            {
                operation: "delete",
                mode: "delete",
                id: id,
                subjectId: id
            }
        );

        await swalSuccess(
            "ลบรายวิชาเรียบร้อยแล้ว"
        );

        await loadSubjectsPage();

    } catch (error) {

        await swalError(
            "ไม่สามารถลบรายวิชา",
            error.message
        );

    } finally {

        setLoading(false);
    }
}

async function saveClass(event) {

    event.preventDefault();

    const id =
        $("#classId").value.trim();


    const payload = {

        operation:
            id
                ? "update"
                : "create",

        mode:
            id
                ? "update"
                : "create",

        id: id,
        classId: id,

        gradeLevel:
            $("#classGradeLevel").value.trim(),

        level:
            $("#classGradeLevel").value.trim(),

        room:
            $("#classRoom").value.trim(),

        advisor1Id:
            $("#advisor1").value,

        advisor2Id:
            $("#advisor2").value
    };


    setLoading(
        true,
        "กำลังบันทึกชั้นเรียน"
    );

    try {

        await apiRequest(
            "classes",
            payload

        closeModal();

        await swalError(
            "ไม่สามารถบันทึกชั้นเรียน",
            error.message
        );

    } finally {

        setLoading(false);
    }
}

async function loadClassOptions(
    selectId,
    includeAll = true
) {

    const response =
        await apiRequest(
            "classes",
            {
                operation: "list",
                mode: "list"
            }
        );

    const rows =
        extractRows(response);

    AppState.cache.classes =
        rows;


    const select =
        $("#" + selectId);

    if (!select) {
        return;
    }


    const current =
        select.value;


    select.innerHTML =
        includeAll
        ? `
            <option value="">
                ทุกชั้นเรียน
            </option>
        `
        : `
            <option value="">
                เลือกชั้นเรียน
            </option>
        `;


    rows.forEach(row => {

        const id =
            getObjectValue(
                row,
                [
                    "id",
                    "classId",
                    "ID"
                ],
                ""
            );

        const level =
            getObjectValue(
                row,
                [
                    "gradeLevel",
                    "level"
                ],
                ""
            );

        const room =
            getObjectValue(
                row,
                ["room"],
                ""
            );


        select.insertAdjacentHTML(
            "beforeend",
            `
                <option value="${escapeHtml(id)}">
                    ${escapeHtml(level)} / ห้อง ${escapeHtml(room)}
                </option>
            `
        );
    });


    if (current) {
        select.value = current;
    }
}

async function saveStudent(event) {

    event.preventDefault();

    const recordId =
        $("#studentRecordId")
            .value.trim();


    const payload = {

        operation:
            recordId
                ? "update"
                : "create",

        mode:
            recordId
                ? "update"
                : "create",

        id: recordId,

        studentRecordId:
            recordId,

        studentId:
            $("#studentId").value.trim(),

        code:
            $("#studentId").value.trim(),

        prefix:
            $("#studentPrefix").value,

        firstName:
            $("#studentFirstName")
                .value.trim(),

        lastName:
            $("#studentLastName")
                .value.trim(),

        nationalId:
            $("#studentNationalId")
                .value.trim(),

        classId:
            $("#studentClassId").value
    };


    setLoading(
        true,
        "กำลังบันทึกข้อมูลนักเรียน"
    );

    try {

        await apiRequest(
            "students",
            payload
        );

        closeModal();

        await swalSuccess(
            "บันทึกข้อมูลนักเรียนเรียบร้อยแล้ว"
        );

        await loadStudentsPage();

    } catch (error) {

        await swalError(
            "ไม่สามารถบันทึกข้อมูลนักเรียน",
            error.message
        );

    } finally {

        setLoading(false);
    }
}


async function deleteStudent(id) {

    const confirm =
        await Swal.fire({
            icon: "warning",
            title: "ยืนยันการลบนักเรียน",
            text: "กรุณาตรวจสอบข้อมูลก่อนยืนยัน",
            showCancelButton: true,
            confirmButtonText: "ยืนยันลบ",
            cancelButtonText: "ยกเลิก",
            confirmButtonColor: "#c62828"

    if (!confirm.isConfirmed) {
        return;
    }


    setLoading(
        true,
        "กำลังลบข้อมูลนักเรียน"

    try {

            "students",

let pendingCsvRows = [];


function previewStudentCsv(event) {

    const file =
        event.target.files?.[0];

    if (!file) {
        return;
    }


    Papa.parse(
        file,
        {
            header: true,
            skipEmptyLines: true,
            encoding: "UTF-8",

            complete: function(results) {

                const rows =
                    results.data || [];

                pendingCsvRows =
                    rows.map(
                        row => ({
                            studentId:
                                row["รหัสประจำตัว"] ||
                                row["studentId"] ||
                                row["code"] ||
                                "",

                            prefix:
                                row["คำนำหน้า"] ||
                                row["prefix"] ||
                                "",

                            firstName:
                                row["ชื่อ"] ||
                                row["firstName"] ||
                                "",

                            lastName:
                                row["สกุล"] ||
                                row["lastName"] ||
                                "",

                            nationalId:
                                row["เลขบัตรประจำตัวนักเรียน"] ||
                                row["nationalId"] ||
                                row["idCard"] ||
                                ""
                        })
                    );


                renderCsvPreview();
            },

            error: function(error) {

                swalError(
                    "อ่านไฟล์ CSV ไม่สำเร็จ",
                    error.message
                );
            }
        }
    );
}


function renderCsvPreview() {

    const container =
        $("#csvPreview");

    if (!pendingCsvRows.length) {

        container.innerHTML =
            emptyState(
                "fa-solid fa-file-circle-xmark",
                "ไม่พบข้อมูล",
                "ตรวจสอบหัวตารางและข้อมูลในไฟล์ CSV"
            );

        $("#saveCsvButton")
            .disabled = true;

        return;
    }


    container.innerHTML = `

        <div class="table-container">

            <table
                id="csvPreviewTable"
                class="data-table"
            >

                <thead>

                    <tr>

                        <th>ลำดับ</th>
                        <th>รหัสประจำตัว</th>
                        <th>คำนำหน้า</th>
                        <th>ชื่อ</th>
                        <th>สกุล</th>
                        <th>เลขบัตรประจำตัวนักเรียน</th>
                        <th>จัดลำดับ</th>

                    </tr>

                </thead>

                <tbody id="csvPreviewBody">

                    ${renderCsvRowsHtml()}

                </tbody>

            </table>

        </div>
    `;


    $("#saveCsvButton")
        .disabled = false;
}


function renderCsvRowsHtml() {

    return pendingCsvRows.map(
        (row, index) => `

            <tr>

                <td class="text-center">
                    ${index + 1}
                </td>

                <td>
                    <input
                        value="${escapeHtml(row.studentId)}"
                        onchange="updateCsvValue(${index}, 'studentId', this.value)"
                    >
                </td>

                <td>
                    <input
                        value="${escapeHtml(row.prefix)}"
                        onchange="updateCsvValue(${index}, 'prefix', this.value)"
                    >
                </td>

                <td>
                    <input
                        value="${escapeHtml(row.firstName)}"
                        onchange="updateCsvValue(${index}, 'firstName', this.value)"
                    >
                </td>

                <td>
                    <input
                        value="${escapeHtml(row.lastName)}"
                        onchange="updateCsvValue(${index}, 'lastName', this.value)"
                    >
                </td>

                <td>
                    <input
                        value="${escapeHtml(row.nationalId)}"
                        onchange="updateCsvValue(${index}, 'nationalId', this.value)"
                    >
                </td>

                <td>

                    <div style="display:flex;gap:4px;">

                        <button
                            class="btn btn-secondary btn-sm"
                            onclick="moveCsvRow(${index}, -1)"
                            ${index === 0 ? "disabled" : ""}
                        >
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>

                        <button
                            class="btn btn-secondary btn-sm"
                            onclick="moveCsvRow(${index}, 1)"
                            ${index === pendingCsvRows.length - 1 ? "disabled" : ""}
                        >
                            <i class="fa-solid fa-arrow-down"></i>
                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="removeCsvRow(${index})"
                        >
                            <i class="fa-solid fa-trash"></i>
                        </button>

                    </div>

                </td>

            </tr>
        `
    ).join("");
}


function updateCsvValue(
    index,
    key,
    value
) {

    if (
        pendingCsvRows[index]
    ) {

        pendingCsvRows[index][key] =
            value;
    }
}


function moveCsvRow(
    index,
    direction
) {

    const target =
        index + direction;

    if (
        target < 0 ||
        target >= pendingCsvRows.length
    ) {
        return;
    }


    const temp =
        pendingCsvRows[index];

    pendingCsvRows[index] =
        pendingCsvRows[target];

    pendingCsvRows[target] =
        temp;


    $("#csvPreviewBody").innerHTML =
        renderCsvRowsHtml();
}


function removeCsvRow(index) {

    pendingCsvRows.splice(
        index,
        1
    );

    if (!pendingCsvRows.length) {

        renderCsvPreview();

        return;
    }

    $("#csvPreviewBody").innerHTML =
        renderCsvRowsHtml();
}


async function saveImportedStudents() {

    const classId =
        $("#csvClassId").value;


    if (!classId) {

        await swalWarning(
            "กรุณาเลือกชั้นเรียน"
        );

        return;
    }


    if (!pendingCsvRows.length) {

        await swalWarning(
            "ไม่มีข้อมูลสำหรับบันทึก"
        );

        return;
    }


    setLoading(
        true,
        "กำลังนำเข้าข้อมูลนักเรียน"
    );


    try {

        await apiRequest(
            "students/import",
            {
                operation: "import",
                mode: "import",
                classId: classId,
                rows: pendingCsvRows,
                students: pendingCsvRows
            }
        );


        pendingCsvRows = [];

        closeModal();

        await swalSuccess(
            "นำเข้าข้อมูลนักเรียนเรียบร้อยแล้ว"
        );

        await loadStudentsPage();

    } catch (error) {

        await swalError(
            "นำเข้าข้อมูลไม่สำเร็จ",
            error.message
        );

    } finally {

        setLoading(false);
    }
}


async function downloadCsvTemplate() {

    try {

        const response =
            await apiRequest(
                "csvTemplate",
                {
                    type: "students"
                }
            );


        const data =
            extractData(response);


        const csv =
            data.csv ||
            data.content ||
            data.template ||
            "รหัสประจำตัว,คำนำหน้า,ชื่อ,สกุล,เลขบัตรประจำตัวนักเรียน\n";


        const blob =
            new Blob(
                [
                    "\uFEFF" + csv
                ],
                {
                    type: "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "SchooLNext_Student_Template.csv";

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);

    } catch (error) {

        await swalError(
            "ดาวน์โหลดแบบฟอร์มไม่สำเร็จ",
            error.message
        );
    }
}

async function saveGradeRule(event) {

    event.preventDefault();

    const id =
        $("#gradeRuleId").value;


    const min =
        Number($("#gradeMin").value);

    const max =
        Number($("#gradeMax").value);


    if (
        !Number.isFinite(min) ||
        !Number.isFinite(max) ||
        min > max
    ) {

        await swalWarning(
            "ช่วงคะแนนไม่ถูกต้อง"
        );

        return;
    }


    setLoading(
        true,
        "กำลังบันทึกเกณฑ์การให้เกรด"
    );


    try {

        await apiRequest(
            "gradeRules",
            {
                operation:
                    id
                        ? "update"
                        : "create",

                mode:
                    id
                        ? "update"
                        : "create",

                id: id,
                ruleId: id,

                minScore: min,
                maxScore: max,

                grade:
                    $("#gradeValue").value.trim(),

                description:
                    $("#gradeDescription")
                        .value.trim()
            }
        );


        closeModal();

        await swalSuccess(
            "บันทึกเกณฑ์เรียบร้อยแล้ว"
        );

        await loadGradeRulesPage();

    } catch (error) {

        await swalError(
            "ไม่สามารถบันทึกเกณฑ์",
            error.message
        );

    } finally {

        setLoading(false);
    }
}

            $("#" + prefix + "EndDate").value,

        endTime:
            $("#" + prefix + "EndTime").value
    };


    setLoading(
        true,
        "กำลังบันทึกการตั้งค่า"
    );

async function prepareScoreEntryOptions() {

    const response =
        await apiRequest(
            "assignments",
            {
                operation: "teacherList",
                mode: "teacherList"
            }
        );


    let assignments =
        extractRows(response);


    if (!assignments.length) {

        const fallback =
            await apiRequest(
                "assignments",
                {
                    operation: "list",
                    mode: "list",
                    teacherId:
                        getObjectValue(
                            AppState.user,
                            [
                                "id",
                                "teacherId",
                                "userId"
                            ],
                            ""
                        )
                }
            );

        assignments =
            extractRows(fallback);
    }


    AppState.cache.teacherAssignments =
        assignments;


    const subjectMap =
        new Map();

    const classMap =
        new Map();


    assignments.forEach(
        assignment => {

            const subjectId =
                getObjectValue(
                    assignment,
                    [
                        "subjectId"
                    ],
                    ""
                );

            const subjectName =
                getObjectValue(
                    assignment,
                    [
                        "subjectName",
                        "subject"
                    ],
                    "-"
                );

            const subjectCode =
                getObjectValue(
                    assignment,
                    [
                        "subjectCode",
                        "code"
                    ],
                    ""
                );


            if (subjectId) {

                subjectMap.set(
                    String(subjectId),
                    {
                        id: subjectId,
                        name: subjectName,
                        code: subjectCode
                    }
                );
            }


            const classId =
                getObjectValue(
                    assignment,
                    [
                        "classId"
                    ],
                    ""
                );

            const className =
                getObjectValue(
                    assignment,
                    [
                        "className",
                        "classLabel"
                    ],
                    "-"
                );


            if (classId) {

                classMap.set(
                    String(classId),
                    {
                        id: classId,
                        name: className
                    }
                );
            }

        }
    );


    $("#scoreSubject").innerHTML =
        `
            <option value="">
                เลือกรายวิชา
            </option>
        ` +
        Array.from(
            subjectMap.values()
        ).map(
            item => `
                <option value="${escapeHtml(item.id)}">
                    ${escapeHtml(item.code)}
                    ${item.code ? " - " : ""}
                    ${escapeHtml(item.name)}
                </option>
            `
        ).join("");


    $("#scoreClass").innerHTML =
        `
            <option value="">
                เลือกชั้นเรียน
            </option>
        ` +
        Array.from(
            classMap.values()
        ).map(
            item => `
                <option value="${escapeHtml(item.id)}">
                    ${escapeHtml(item.name)}
                </option>
            `
        ).join("");
}


async function loadScoreTable() {

    const subjectId =
        $("#scoreSubject").value;

    const classId =
        $("#scoreClass").value;


    if (
        !subjectId ||
        !classId
    ) {

        await swalWarning(
            "กรุณาเลือกวิชาและชั้นเรียน"
        );

        return;
    }


    setLoading(
        true,
        "กำลังโหลดข้อมูลคะแนน"
    );


    try {

        const response =
            await apiRequest(
                "scores",
                {
                    operation: "list",
                    mode: "list",

                    subjectId:
                        subjectId,

                    classId:
                        classId
                }
            );


        const data =
            extractData(response);


        const students =
            normalizeArray(
                data.students ||
                data.rows ||
                data
            );


        const columns =
            normalizeArray(
                data.columns ||
                data.scoreColumns
            );


        AppState.cache.currentScores = {
            subjectId,
            classId,
            students,
            columns
        };


        renderScoreTable(
            students,
            columns
        );

    } catch (error) {

        $("#scoreTableCard").innerHTML =
            `
                <div class="card-body">
                    ${emptyState(
                        "fa-solid fa-triangle-exclamation",
                        "ไม่สามารถโหลดคะแนน",
                        error.message
                    )}
                </div>
            `;

    } finally {

        setLoading(false);
    }
}


function renderScoreTable(
    students,
    columns
) {

    const container =
        $("#scoreTableCard");


    if (!students.length) {

        container.innerHTML =
            `
                <div class="card-body">
                    ${emptyState(
                        "fa-solid fa-user-graduate",
                        "ไม่พบรายชื่อนักเรียน",
                        "ตรวจสอบชั้นเรียนที่เลือก"
                    )}
                </div>
            `;

        return;
    }


    const normalizedColumns =
        columns.length
            ? columns
            : [
                {
                    id: "score",
                    name: "คะแนน",
                    maxScore: 100,
                    type: "normal"
                }
            ];


    container.innerHTML = `

        <div class="card-header">

            <div>
                <h3>
                    ตารางคะแนน
                </h3>

                <p>
                    ช่องคะแนนต่ำกว่าครึ่งหนึ่งของคะแนนเต็มจะแสดงพื้นหลังสีแดงอ่อน
                </p>
            </div>

            <button
                class="btn btn-primary btn-sm"
                onclick="saveAllScores()"
            >
                <i class="fa-solid fa-floppy-disk"></i>
                บันทึกคะแนนทั้งหมด
            </button>

        </div>

        <div class="card-body">

            <div class="table-container">

                <table
                    id="scoreTable"
                    class="data-table"
                >

                    <thead>

                        <tr>

                            <th>
                                ลำดับ
                            </th>

                            <th>
                                รหัส
                            </th>

                            <th>
                                ชื่อ - สกุล
                            </th>

                            ${
                                normalizedColumns.map(
                                    column => {

                                        const max =
                                            getObjectValue(
                                                column,
                                                [
                                                    "maxScore",
                                                    "maximum"
                                                ],
                                                100
                                            );

                                        const name =
                                            getObjectValue(
                                                column,
                                                [
                                                    "name",
                                                    "columnName",
                                                    "title"
                                                ],
                                                "คะแนน"
                                            );

                                        return `
                                            <th class="text-center">

                                                ${escapeHtml(name)}

                                                <br>

                                                <small>
                                                    เต็ม ${escapeHtml(max)}
                                                </small>

                                            </th>
                                        `;
                                    }
                                ).join("")
                            }

                        </tr>

                    </thead>

                    <tbody>

                        ${
                            students.map(
                                (student, index) => {

                                    const studentId =
                                        getObjectValue(
                                            student,
                                            [
                                                "studentId",
                                                "id",
                                                "studentRecordId"
                                            ],
                                            ""
                                        );

                                    const name =
                                        getObjectValue(
                                            student,
                                            [
                                                "fullName",
                                                "name"
                                            ],
                                            "-"
                                        );


                                    return `
                                        <tr>

                                            <td class="text-center">
                                                ${index + 1}
                                            </td>

                                            <td>
                                                ${escapeHtml(studentId)}
                                            </td>

                                            <td>
                                                ${escapeHtml(name)}
                                            </td>

                                            ${
                                                normalizedColumns.map(
                                                    column => {

                                                        const columnId =
                                                            getObjectValue(
                                                                column,
                                                                [
                                                                    "id",
                                                                    "columnId",
                                                                    "scoreColumnId"
                                                                ],
                                                                ""
                                                            );

                                                        const max =
                                                            toNumber(
                                                                getObjectValue(
                                                                    column,
                                                                    [
                                                                        "maxScore",
                                                                        "maximum"
                                                                    ],
                                                                    100
                                                                ),
                                                                100
                                                            );

                                                        const current =
                                                            getStudentScore(
                                                                student,
                                                                columnId
                                                            );

                                                        const low =
                                                            current !== "" &&
                                                            Number(current) <
                                                            (max / 2);

                                                        return `
                                                            <td class="text-center">

                                                                <input
                                                                    class="
                                                                        score-input
                                                                        ${low ? "score-low" : ""}
                                                                    "
                                                                    type="number"
                                                                    min="0"
                                                                    max="${escapeHtml(max)}"
                                                                    step="0.01"
                                                                    value="${escapeHtml(current)}"
                                                                    data-student-id="${escapeHtml(studentId)}"
                                                                    data-column-id="${escapeHtml(columnId)}"
                                                                    data-max-score="${escapeHtml(max)}"
                                                                    oninput="checkScoreCell(this)"
                                                                >

                                                            </td>
                                                        `;
                                                    }
                                                ).join("")
                                            }

                                        </tr>
                                    `;
                                }
                            ).join("")
                        }

                    </tbody>

                </table>

            </div>

        </div>
    `;
}


function getStudentScore(
    student,
    columnId
) {

    const scores =
        student.scores ||
        student.scoreMap ||
        {};


    if (
        scores[columnId] !== undefined
    ) {
        return scores[columnId];
    }


    const scoreList =
        normalizeArray(
            student.scoreList
        );


    const found =
        scoreList.find(
            item =>
                String(
                    getObjectValue(
                        item,
                        [
                            "columnId",
                            "scoreColumnId"
                        ],
                        ""
                    )
                ) === String(columnId)
        );


    if (found) {

        return getObjectValue(
            found,
            [
                "score",
                "value"
            ],
            ""
        );
    }


    return "";
}


function checkScoreCell(input) {

    const value =
        input.value;

    const max =
        toNumber(
            input.dataset.maxScore,
            100
        );


    input.classList.remove(
        "score-low"
    );


    if (
        value !== "" &&
        Number(value) < max / 2
    ) {

        input.classList.add(
            "score-low"
        );
    }
}


async function saveAllScores() {

    const inputs =
        $$("#scoreTable .score-input");


    if (!inputs.length) {
        return;
    }


    const scores =
        inputs.map(
            input => ({
                studentId:
                    input.dataset.studentId,

                columnId:
                    input.dataset.columnId,

                score:
                    input.value === ""
                        ? ""
                        : Number(input.value)
            })
        );


    setLoading(
        true,
        "กำลังบันทึกคะแนน"
    );


    try {

        await apiRequest(
            "scores",
            {
                operation: "save",
                mode: "save",

                subjectId:
                    $("#scoreSubject").value,

                classId:
                    $("#scoreClass").value,

                scores:
                    scores
            }
        );


        await swalSuccess(
            "บันทึกคะแนนเรียบร้อยแล้ว"
        );


        await loadScoreTable();

    } catch (error) {

        await swalError(
            "ไม่สามารถบันทึกคะแนน",
            error.message
        );

    } finally {

        setLoading(false);
    }
}

function appealStatusBadge(status) {

    const text =
        String(status || "");

    const lower =
        text.toLowerCase();


    if (
        lower.includes("approved") ||
        text.includes("อนุมัติ") ||
        text.includes("ผ่าน")
    ) {

        return `
            <span class="badge badge-success">
                ${escapeHtml(text)}
            </span>
        `;
    }


    if (
        lower.includes("reject") ||
        text.includes("ไม่อนุมัติ") ||
        text.includes("ไม่ผ่าน")
    ) {

        return `
            <span class="badge badge-danger">
                ${escapeHtml(text)}
            </span>
        `;
    }


    return `
        <span class="badge badge-warning">
            ${escapeHtml(text || "รอดำเนินการ")}
        </span>
    `;
}

            "กรุณาเลือกรายวิชา"
        );

        return;
    }


    setLoading(
        true,
        "กำลังโหลดคะแนน"
    );


    try {

        const response =
            await apiRequest(
                "scores",
                {
                    operation: "studentView",
                    mode: "studentView",
                    subjectId: subjectId
                }
            );


        const data =
            extractData(response);


        const visible =
            data.canView !== false &&
