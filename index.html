async function submitStudentAppeal(event) {

    event.preventDefault();


    const selected =
        $$(".appeal-column-check")
            .filter(
                input => input.checked
            )
            .map(
                input => input.value
            );


    if (!selected.length) {

        await swalWarning(
            "กรุณาเลือกช่องคะแนนอย่างน้อย 1 รายการ"
        );

        return;
    }


    const reason =
        $("#appealReason")
            .value.trim();


    if (!reason) {

        await swalWarning(
            "กรุณากรอกเหตุผล"
        );

        return;
    }


    setLoading(
        true,
        "กำลังส่งคำร้อง"
    );


    try {

        let imageData = null;


        const file =
            $("#appealImage")
                ?.files?.[0];


        if (file) {

            imageData =
                await fileToBase64(
                    file
                );


            const uploadResponse =
                await apiRequest(
                    "uploadAppealImage",
                    {
                        fileName:
                            file.name,

                        mimeType:
                            file.type,

                        base64:
                            imageData
                    }
                );


            imageData =
                extractData(
                    uploadResponse
                );
        }


        await apiRequest(
            "appeals",
            {
                operation: "create",
                mode: "create",

                subjectId:
                    $("#studentScoreSubject")
                        .value,

                columnIds:
                    selected,

                reason:
                    reason,

                image:
                    imageData
            }
        );


        closeModal();

        await swalSuccess(
            "ส่งคำร้องเรียบร้อยแล้ว"
        );


    } catch (error) {

        await swalError(
            "ไม่สามารถส่งคำร้อง",
            error.message
        );

    } finally {

        setLoading(false);
    }
}


function fileToBase64(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => {

                    const result =
                        String(
                            reader.result
                        );

                    const comma =
                        result.indexOf(",");

                    resolve(
                        comma >= 0
                            ? result.substring(
                                comma + 1
                            )
                            : result
                    );
                };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);
        }
    );
}

   ================================================================ */

function filterTable(
    tableId,
    keyword
) {

    const table =
        document.getElementById(
            tableId
        );


    if (!table) {
        return;
    }


    const search =
        String(
            keyword || ""
        ).toLowerCase().trim();


    const rows =
        table.querySelectorAll(
            "tbody tr"
        );


    rows.forEach(
        row => {

            const text =
                row.textContent
                    .toLowerCase();

            row.style.display =
                !search ||
                text.includes(search)
                    ? ""
                    : "none";
        }
    );
}

function bindEvents() {

    $("#togglePassword")
        .addEventListener(
            "click",
            function() {

                const input =
                    $("#loginPassword");

                const icon =
                    this.querySelector(
                        "i"
                    );


                if (
                    input.type ===
                    "password"
                ) {

                    input.type =
                        "text";

                    icon.className =
                        "fa-solid fa-eye-slash";

                } else {

                    input.type =
                        "password";

                    icon.className =
                        "fa-solid fa-eye";
                }
            }
        );


    $("#loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    $("#loginUsername")
                        .value.trim();

                const password =
                    $("#loginPassword")
                        .value;

                const remember =
                    $("#rememberLogin")
                        .checked;


                if (!username) {

                    await swalWarning(
                        "กรุณากรอกชื่อผู้ใช้"
                    );

                    $("#loginUsername")
                        .focus();

                    return;
                }


                if (!password) {

                    await swalWarning(
                        "กรุณากรอกรหัสผ่าน"
                    );

                    $("#loginPassword")
                        .focus();

                    return;
                }


                await login(
                    username,
                    password,
                    remember
                );
            }
        );


    $("#logoutButton")
        .addEventListener(
            "click",
            async function() {

                const result =
                    await Swal.fire({
                        icon: "question",
                        title: "ต้องการออกจากระบบหรือไม่?",
                        showCancelButton: true,
                        confirmButtonText: "ออกจากระบบ",
                        cancelButtonText: "ยกเลิก",
                        confirmButtonColor: "#c62828"
                    });


                if (
                    result.isConfirmed
                ) {

                    await performLogout();
                }
            }
        );


    $("#mobileMenuButton")
        .addEventListener(
            "click",
            openMobileSidebar
        );


    $("#mobileOverlay")
        .addEventListener(
            "click",
            closeMobileSidebar
        );
}


/* ================================================================
   SESSION VALIDATION
   ================================================================ */

async function restoreSession() {

    const stored =
        loadStoredSession();


    if (!stored) {

        showLoginScreen();

        return;
    }


    AppState.session =
        stored;

    AppState.user =
        stored.user || {};

    AppState.permissions =
        stored.permissions || {};


    setLoading(
        true,
        "กำลังตรวจสอบ Session"
    );


    try {

        const response =
            await apiRequest(
                "getSession",
                {
                    token:
                        stored.token
                },
                {
                    timeout: 15000
                }
            );


        const data =
            extractData(response);


        if (
            data &&
            data.user
        ) {

            AppState.user =
                data.user;

            AppState.session.user =
                data.user;
        }


        if (
            data &&
            data.permissions
        ) {

            AppState.permissions =
                data.permissions;

            AppState.session.permissions =
                data.permissions;
        }


        saveSession(
            AppState.session
        );


        showApp();

        await loadDashboard();


    } catch (error) {

        console.warn(
            "RESTORE SESSION:",
            error
        );

        clearSession();

        showLoginScreen();

    } finally {

        setLoading(false);
    }
}


/* ================================================================
   INITIALIZE
   ================================================================ */

async function initializeApp() {

    try {

        bindEvents();

        await restoreSession();

    } catch (error) {

        console.error(
            "INITIALIZATION ERROR:",
            error
        );

        clearSession();

        showLoginScreen();

    } finally {

        $("#initialLoader")
            .classList.add(
                "hidden"
            );

        AppState.initialized =
            true;
    }
}
