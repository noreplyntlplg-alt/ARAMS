const API_URL='https://script.google.com/macros/s/AKfycbxb8zvx8ooGmv5bXbTegjiwjEDmBpXmN9agO0Ef9qHi0IDleSQjgnaRPU5I1NMlGaw3hA/exec';

 {section:'หลักสูตรและรายวิชา',items:[['subjects','จัดการรายวิชา','fa-book',['ADMIN','ACADEMIC_AFFAIRS','TEACHER']],['curriculum','โครงสร้างหลักสูตร','fa-layer-group',['ADMIN','ACADEMIC_AFFAIRS']],['teaching','จัดตารางสอน','fa-calendar-days',['ADMIN','ACADEMIC_AFFAIRS','TEACHER']]]},
 {section:'คะแนนและวัดผล',items:[['scores','บันทึกคะแนน','fa-pen-to-square',['ADMIN','ACADEMIC_AFFAIRS','TEACHER','HOMEROOM_TEACHER']],['assessment','งานวัดและประเมินผล','fa-chart-column',['ADMIN','PRINCIPAL','ACADEMIC_AFFAIRS','TEACHER','HOMEROOM_TEACHER','STUDENT','PARENT']],['remedial','แก้ผลการเรียน / แก้ตัว','fa-screwdriver-wrench',['ADMIN','ACADEMIC_AFFAIRS','TEACHER','HOMEROOM_TEACHER','STUDENT','PARENT']]]},

 {section:'เอกสารและรายงาน',items:[['documents','ออกเอกสาร / ใบรายงาน','fa-file-lines',['ADMIN','PRINCIPAL','ACADEMIC_AFFAIRS','REGISTRAR','STUDENT','PARENT']],['reports','รายงานฝ่ายวิชาการ','fa-file-invoice',['ADMIN','PRINCIPAL','ACADEMIC_AFFAIRS']]]},
 {section:'ระบบสื่อสาร',items:[['announcements','ประกาศ','fa-bullhorn',[]],['notifications','แจ้งเตือน','fa-bell',[]]]},
 {section:'ผู้ใช้งานและตั้งค่า',items:[['users','ผู้ใช้งานและสิทธิ์','fa-users-gear',['ADMIN']],['settings','ตั้งค่าระบบ','fa-gear',['ADMIN','PRINCIPAL','ACADEMIC_AFFAIRS']]]}
];
const TITLES={dashboard:'หน้าหลัก / Dashboard',analytics:'สถิติและวิเคราะห์ข้อมูล',students:'ข้อมูลนักเรียน',classes:'การจัดชั้นเรียน','student-history':'ประวัติการศึกษา',subjects:'จัดการรายวิชา',curriculum:'โครงสร้างหลักสูตร',teaching:'จัดตารางสอน',scores:'บันทึกคะแนน',assessment:'งานวัดและประเมินผล',remedial:'แก้ผลการเรียน / แก้ตัว',attendance:'งานการมาเรียน',leave:'งานลา',documents:'ออกเอกสาร / ใบรายงาน',reports:'รายงานฝ่ายวิชาการ',announcements:'ประกาศ',notifications:'แจ้งเตือน',users:'ผู้ใช้งานและสิทธิ์',settings:'ตั้งค่าระบบ'};
const ICONS={students:'fa-user-graduate',classes:'fa-school',subjects:'fa-book',curriculum:'fa-layer-group',teaching:'fa-calendar-days',scores:'fa-pen-to-square',assessment:'fa-chart-column',remedial:'fa-screwdriver-wrench',attendance:'fa-calendar-check',leave:'fa-file-signature',documents:'fa-file-lines',reports:'fa-file-invoice',announcements:'fa-bullhorn',notifications:'fa-bell',users:'fa-users-gear',settings:'fa-gear'};
const FIELD_LABELS={studentNumber:'เลขประจำตัว',nationalId:'เลขประจำตัวประชาชน',title:'คำนำหน้า',firstName:'ชื่อ',lastName:'นามสกุล',birthDate:'วันเกิด',gender:'เพศ',classId:'ห้อง',academicYear:'ปีการศึกษา',photoUrl:'รูปนักเรียน',address:'ที่อยู่',phone:'โทรศัพท์',parentId:'ผู้ปกครอง',status:'สถานะ',subjectCode:'รหัสวิชา',subjectName:'ชื่อวิชา',learningArea:'กลุ่มสาระ',subjectType:'ประเภทวิชา',credits:'หน่วยกิต',hoursPerWeek:'ชั่วโมง/สัปดาห์',hoursPerTerm:'ชั่วโมง/ภาคเรียน',teacherId:'ครูผู้สอน',period:'คาบ',date:'วันที่',term:'ภาคเรียน',workScore:'คะแนนเก็บ',midtermScore:'กลางภาค',finalScore:'ปลายภาค',totalScore:'รวม',percentage:'ร้อยละ',grade:'ผลการเรียน',reason:'เหตุผล',note:'หมายเหตุ'};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function label(k){return FIELD_LABELS[k]||String(k).replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase());}
function val(obj,k){return obj&&obj[k]!==undefined?obj[k]:'';}
function showLoading(x=true){document.getElementById('loading').classList.toggle('hidden',!x);state.loading=x}
function toast(msg,type='info'){const r=document.getElementById('toastRoot');const d=document.createElement('div');d.className='toast '+type;d.innerHTML='<i class="fa-solid '+(type==='success'?'fa-circle-check':type==='error'?'fa-circle-exclamation':'fa-circle-info')+'"></i><div>'+esc(msg)+'</div>';r.appendChild(d);setTimeout(()=>d.remove(),3800)}
async function api(action,payload={}){const body=Object.assign({},payload,{action});if(state.token&&!body.token)body.token=state.token;showLoading(true);try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const text=await response.text();let json;try{json=JSON.parse(text)}catch(e){throw new Error('API ส่งข้อมูลไม่ใช่ JSON: '+text.slice(0,300))}if(!json.success)throw new Error(json.error||'เกิดข้อผิดพลาดจาก API');return json.data}finally{showLoading(false)}}
function saveSession(){localStorage.setItem(STORAGE_KEY,JSON.stringify({token:state.token,user:state.user}))}
function loadSession(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');state.token=x.token||'';state.user=x.user||null}catch(e){state.token='';state.user=null}}
async function boot(){loadSession();if(state.token){try{const me=await api('me');state.user=me.user;await loadSettings();renderApp();return}catch(e){localStorage.removeItem(STORAGE_KEY);state.token='';state.user=null}}renderLogin()}
async function loadSettings(){try{state.settings=await api('getSettings')}catch(e){state.settings=null}}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="login-screen"><div class="login-card"><div class="brand"><div class="brand-logo"><i class="fa-solid fa-building-columns"></i></div><h1>ARAMS</h1><p>Academic Registration and Assessment Management System</p><p>ระบบบริหารงานทะเบียนและวัดผล</p></div><div id="loginError" class="login-error hidden"></div><form id="loginForm"><div class="field"><label>ชื่อผู้ใช้</label><input id="loginUsername" autocomplete="username" required></div><div class="field"><label>รหัสผ่าน</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" style="width:100%;padding:11px" type="submit"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button></form><div class="small" style="text-align:center;margin-top:14px">ระบบเชื่อมต่อ Google Apps Script และ Google Sheets โดยตรง</div></div></div>`;document.getElementById('loginForm').addEventListener('submit',doLogin)}
async function doLogin(e){e.preventDefault();const er=document.getElementById('loginError');er.classList.add('hidden');try{const r=await api('login',{username:document.getElementById('loginUsername').value,password:document.getElementById('loginPassword').value});state.token=r.token;state.user=r.user;saveSession();await loadSettings();state.route='dashboard';renderApp();toast('เข้าสู่ระบบสำเร็จ','success')}catch(err){er.textContent=err.message;er.classList.remove('hidden')}}
async function doLogout(){try{if(state.token)await api('logout')}catch(e){}localStorage.removeItem(STORAGE_KEY);state.token='';state.user=null;state.settings=null;renderLogin()}
function allowed(roles){return !roles||roles.length===0||roles.includes(state.user?.role)}
function renderApp(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar"><div class="side-head"><div class="side-mark"><i class="fa-solid fa-building-columns"></i></div><div class="side-title"><strong>ARAMS</strong><span>ทะเบียนและวัดผล</span></div></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="topbar"><div class="top-left"><button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button><div class="page-title" id="pageTitle"></div></div><div class="user-box"><div class="user-meta"><strong>${esc(state.user?.displayName||'')}</strong><small>${esc(ROLE_LABEL[state.user?.role]||state.user?.role||'')}</small></div><div class="avatar">${esc((state.user?.displayName||'A').trim().charAt(0))}</div><button class="btn btn-secondary" title="ออกจากระบบ" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i></button></div></header><section class="content" id="content"></section></main></div>`;renderNav();navigate(state.route||'dashboard')}
function renderNav(){const n=document.getElementById('nav');n.innerHTML='';MENU.forEach(sec=>{const items=sec.items.filter(x=>allowed(x[3]));if(!items.length)return;const h=document.createElement('div');h.className='nav-section';h.textContent=sec.section;n.appendChild(h);items.forEach(([route,title,icon])=>{const b=document.createElement('button');b.dataset.route=route;b.innerHTML=`<i class="fa-solid ${icon}"></i><span>${esc(title)}</span>`;b.onclick=()=>navigate(route);n.appendChild(b)})})}
function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open')}
async function navigate(route){if(!TITLES[route])route='dashboard';state.route=route;state.page=1;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===route));document.getElementById('pageTitle').textContent=TITLES[route];document.getElementById('sidebar')?.classList.remove('open');const c=document.getElementById('content');c.innerHTML='<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><div>กำลังโหลดข้อมูล...</div></div>';try{if(route==='dashboard')await renderDashboard();else if(route==='analytics')await renderAnalytics();else if(route==='students')await renderStudents();else if(route==='classes')await renderClasses();else if(route==='student-history')await renderStudentHistory();else if(route==='subjects')await renderSubjects();else if(route==='curriculum')await renderCurriculum();else if(route==='teaching')await renderTeaching();else if(route==='scores')await renderScores();else if(route==='assessment')await renderAssessment();else if(route==='remedial')await renderRemedial();else if(route==='attendance')await renderAttendance();else if(route==='leave')await renderLeave();else if(route==='documents')await renderDocuments();else if(route==='reports')await renderReports();else if(route==='announcements')await renderAnnouncements();else if(route==='notifications')await renderNotifications();else if(route==='users')await renderUsers();else if(route==='settings')await renderSettings()}catch(e){if(/Session|เข้าสู่ระบบ/.test(e.message)){doLogout();return}c.innerHTML=`<div class="notice danger"><strong>ไม่สามารถโหลดข้อมูล</strong><br>${esc(e.message)}</div>`}}
function statCard(icon,labelText,value,cls=''){return `<div class="stat-card"><div class="stat-top"><span>${esc(labelText)}</span><span class="stat-icon ${cls}"><i class="fa-solid ${icon}"></i></span></div><div class="stat-value">${esc(value)}</div></div>`}
function dashboardCharts(d){const g=d.gradeDistribution||{};const keys=['4','3.5','3','2.5','2','1.5','1','0','ร','มส','มผ'];const max=Math.max(1,...keys.map(k=>Number(g[k]||0)));return `<div class="chart-bars">${keys.map(k=>`<div class="bar-item"><div class="bar"><span style="height:${Math.max(3,(Number(g[k]||0)/max)*120)}px"></span></div><div class="bar-value">${esc(g[k]||0)}</div><div class="bar-label">${esc(k)}</div></div>`).join('')}</div>`}
async function renderDashboard(){const d=await api('getDashboard',{});const n=d.counts||{},g=d.gradeCounts||{},a=d.attendanceToday||{};document.getElementById('content').innerHTML=`<div class="toolbar"><div><div class="small">ภาพรวมข้อมูลระบบ</div><h2 style="margin:0;color:var(--navy)">${esc(state.settings?.schoolName||'โรงเรียน')}</h2></div><div class="spacer"></div><button class="btn btn-secondary" onclick="navigate('notifications')"><i class="fa-solid fa-bell"></i> แจ้งเตือน</button></div><div class="cards">${statCard('fa-user-graduate','นักเรียนทั้งหมด',n.students||0)}${statCard('fa-mars','นักเรียนชาย',n.male||0)}${statCard('fa-venus','นักเรียนหญิง',n.female||0)}${statCard('fa-chalkboard-user','ครู',n.teachers||0)}${statCard('fa-school','ห้องเรียน',n.classes||0)}${statCard('fa-book','รายวิชา',n.subjects||0)}${statCard('fa-circle-check','ผลการเรียนครบ',g.complete||0)}${statCard('fa-circle-xmark','นักเรียนมี 0',g.zero||0)}${statCard('fa-circle-question','นักเรียนมี ร',g.R||0)}${statCard('fa-triangle-exclamation','นักเรียนมี มส',g.MS||0)}${statCard('fa-ban','นักเรียนมี มผ',g.MP||0)}${statCard('fa-screwdriver-wrench','ต้องแก้ตัว',g.remedial||0)}</div><div class="grid-2"><div class="panel"><div class="panel-head"><h3><i class="fa-solid fa-chart-column"></i> สรุปผลการเรียน</h3></div><div class="panel-body">${dashboardCharts(d)}</div></div><div class="panel"><div class="panel-head"><h3><i class="fa-solid fa-calendar-check"></i> การมาเรียนวันนี้</h3></div><div class="panel-body"><div class="cards" style="grid-template-columns:repeat(3,1fr);margin:0">${statCard('fa-check','มา',a.present||0)}${statCard('fa-xmark','ขาด',a.absent||0)}${statCard('fa-person-walking-arrow-right','สาย',a.late||0)}${statCard('fa-file-medical','ลา',a.leave||0)}${statCard('fa-people-group','กิจกรรม',a.activity||0)}${statCard('fa-ellipsis','อื่น ๆ',a.other||0)}</div></div></div></div><div class="panel"><div class="panel-head"><h3><i class="fa-solid fa-list-check"></i> งานที่ยังไม่ดำเนินการ</h3><button class="btn btn-secondary" onclick="navigate('scores')">ไปบันทึกคะแนน</button></div><div class="panel-body">${(d.pendingTasks||[]).length?tableFromObjects(d.pendingTasks,['type','teachingId','missing'],false):emptyBox('ไม่มีรายการค้าง')}</div></div>`}
function emptyBox(t){return `<div class="empty"><i class="fa-regular fa-folder-open"></i><div>${esc(t)}</div></div>`}
function toolbar(title,buttons=''){return `<div class="toolbar"><div><h2 style="margin:0;color:var(--navy)">${esc(title)}</h2></div><div class="spacer"></div>${buttons}</div>`}
function searchBar(placeholder='ค้นหา'){return `<div class="field" style="margin:0;min-width:260px"><input id="pageSearch" placeholder="${esc(placeholder)}" value="${esc(state.search)}" onkeydown="if(event.key==='Enter')reloadRoute()"></div><button class="btn btn-secondary" onclick="reloadRoute()"><i class="fa-solid fa-magnifying-glass"></i> ค้นหา</button>`}
async function reloadRoute(){state.search=document.getElementById('pageSearch')?.value||'';state.page=1;await navigate(state.route)}
function tableFromObjects(arr,keys,actions=true){if(!arr||!arr.length)return emptyBox('ไม่พบข้อมูล');return `<div class="table-wrap"><table class="table"><thead><tr>${keys.map(k=>`<th>${esc(label(k))}</th>`).join('')}${actions?'<th>จัดการ</th>':''}</tr></thead><tbody>${arr.map((r,i)=>`<tr>${keys.map(k=>`<td>${formatCell(r[k],k)}</td>`).join('')}${actions?`<td><button class="btn btn-secondary" onclick='viewObject(${JSON.stringify(r).replace(/'/g,"&#39;")})'><i class="fa-solid fa-eye"></i></button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function formatCell(v,k){if(v===null||v===undefined||v==='')return '<span class="small">—</span>';if(k==='status'||k==='gradeStatus'){let c=['ACTIVE','APPROVED','ผ่าน','เสร็จสิ้น','ส่งงานแล้ว'].includes(String(v))?'badge-success':['PENDING','รอดำเนินการ','กำลังดำเนินการ','ร'].includes(String(v))?'badge-warning':['REJECTED','ไม่ผ่าน','0','มส','มผ'].includes(String(v))?'badge-danger':'badge-muted';return `<span class="badge ${c}">${esc(v)}</span>`}return esc(v)}
function viewObject(o){openModal('รายละเอียดข้อมูล',`<div class="table-wrap"><table class="table">${Object.keys(o||{}).map(k=>`<tr><th style="width:30%">${esc(label(k))}</th><td>${formatCell(o[k],k)}</td></tr>`).join('')}</table></div>`,'<button class="btn btn-secondary" onclick="closeModal()">ปิด</button>')}
function modalForm(title,fields,data,onSave,saveText='บันทึก'){const idv='form_'+Date.now();let html=`<form id="${idv}"><div class="form-grid">${fields.map(f=>{const v=val(data,f.name);return `<div class="field ${f.full?'full':''}"><label>${esc(f.label||label(f.name))}${f.required?' *':''}</label>${f.type==='textarea'?`<textarea name="${esc(f.name)}" rows="4" ${f.required?'required':''}>${esc(v)}</textarea>`:f.type==='select'?`<select name="${esc(f.name)}" ${f.required?'required':''}><option value="">-- เลือก --</option>${(f.options||[]).map(o=>`<option value="${esc(o.value??o)}" ${String(v)===String(o.value??o)?'selected':''}>${esc(o.label??o)}</option>`).join('')}</select>`:`<input type="${f.type||'text'}" name="${esc(f.name)}" value="${esc(v)}" ${f.required?'required':''}>`}</div>`}).join('')}</div></form>`;openModal(title,html,`<button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="submitModalForm('${idv}')"><i class="fa-solid fa-floppy-disk"></i> ${esc(saveText)}</button>`);window.__modalSave=onSave}
async function submitModalForm(idv){const form=document.getElementById(idv);if(!form.reportValidity())return;const fd=new FormData(form);const d={};fd.forEach((v,k)=>d[k]=v);try{await window.__modalSave(d);closeModal();toast('บันทึกข้อมูลสำเร็จ','success');await navigate(state.route)}catch(e){toast(e.message,'error')}}
function openModal(title,body,foot=''){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML='';window.__modalSave=null}
function fieldOptions(list){return list.map(x=>({value:x.id||x.value,label:x.name||x.label||x.className||x.subjectName||x.displayName||x}))}
async function renderStudents(){const r=await api('getStudents',{filters:{search:state.search,page:state.page,pageSize:state.pageSize}});const a=r.items||r||[];document.getElementById('content').innerHTML=toolbar('ข้อมูลนักเรียน',`${searchBar('ค้นหาเลขประจำตัว ชื่อ นามสกุล')} ${canWrite(['ADMIN','ACADEMIC_AFFAIRS','REGISTRAR','HOMEROOM_TEACHER'])?`<button class="btn btn-primary" onclick="studentForm()"><i class="fa-solid fa-plus"></i> เพิ่มนักเรียน</button>`:''}`)+`<div class="panel"><div class="panel-body">${studentTable(a)}</div>${pagination(r)}</div>`}
function studentTable(a){if(!a.length)return emptyBox('ไม่พบข้อมูลนักเรียน');return `<div class="table-wrap"><table class="table"><thead><tr><th>เลขประจำตัว</th><th>ชื่อ–นามสกุล</th><th>เพศ</th><th>ชั้น/ห้อง</th><th>ปีการศึกษา</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.studentNumber)}</td><td><strong>${esc((x.title||'')+' '+x.firstName+' '+x.lastName)}</strong></td><td>${esc(x.gender)}</td><td>${esc(x.classId)}</td><td>${esc(x.academicYear)}</td><td>${formatCell(x.status,'status')}</td><td><button class="btn btn-secondary" onclick="editStudent('${esc(x.studentId)}')"><i class="fa-solid fa-pen"></i></button> <button class="btn btn-secondary" onclick="openStudent('${esc(x.studentId)}')"><i class="fa-solid fa-eye"></i></button></td></tr>`).join('')}</tbody></table></div>`}
function canWrite(roles){return allowed(roles)}
async function studentForm(idv=''){let d={};if(idv)d=await api('getStudent',{studentId:idv});const classes=await api('getClasses',{filters:{page:1,pageSize:500}});const parents=await api('getParents',{filters:{page:1,pageSize:500}});const cs=(classes.items||classes||[]).map(x=>({value:x.classId,label:x.className||(`${x.level||''}/${x.room||''}`)}));const ps=(parents.items||parents||[]).map(x=>({value:x.parentId,label:(x.title||'')+' '+x.firstName+' '+x.lastName}));modalForm(idv?'แก้ไขข้อมูลนักเรียน':'เพิ่มนักเรียน',[{name:'studentId',type:'hidden'},{name:'studentNumber',label:'เลขประจำตัวนักเรียน',required:true},{name:'nationalId',label:'เลขประจำตัวประชาชน'},{name:'title',label:'คำนำหน้า'},{name:'firstName',label:'ชื่อ',required:true},{name:'lastName',label:'นามสกุล',required:true},{name:'birthDate',label:'วันเดือนปีเกิด',type:'date'},{name:'gender',label:'เพศ',type:'select',options:['ชาย','หญิง']},{name:'classId',label:'ชั้น / ห้อง',type:'select',options:cs},{name:'academicYear',label:'ปีการศึกษา'},{name:'photoUrl',label:'URL รูปนักเรียน'},{name:'address',label:'ที่อยู่',type:'textarea',full:true},{name:'phone',label:'เบอร์โทรศัพท์'},{name:'parentId',label:'ผู้ปกครอง',type:'select',options:ps},{name:'status',label:'สถานะ',type:'select',options:['ACTIVE','GRADUATED','TRANSFERRED','RESIGNED','DISMISSED','SUSPENDED']},{name:'notes',label:'หมายเหตุ',type:'textarea',full:true}],d,async x=>{if(!x.studentId)delete x.studentId;await api('saveStudent',{data:x})})}
async function editStudent(id){await studentForm(id)}
async function openStudent(id){const h=await api('getStudentHistory',{studentId:id});const s=h.student||{};openModal('ประวัตินักเรียน',`<div class="profile-strip"><div class="student-photo">${s.photoUrl?`<img src="${esc(s.photoUrl)}">`:'<i class="fa-solid fa-user"></i>'}</div><div><h2 style="margin:0;color:var(--navy)">${esc((s.title||'')+' '+s.firstName+' '+s.lastName)}</h2><div>เลขประจำตัว: ${esc(s.studentNumber)} | ห้อง: ${esc(s.classId)} | สถานะ: ${esc(s.status)}</div></div></div><div class="panel"><div class="panel-head"><h3>ผลการเรียน</h3></div><div class="panel-body">${tableFromObjects(h.grades||[],['academicYear','term','subjectId','totalScore','grade','gradePoint','status'],false)}</div></div><div class="panel"><div class="panel-head"><h3>การมาเรียน</h3></div><div class="panel-body">${tableFromObjects(h.attendance||[],['date','period','subjectId','status','minutes'],false)}</div></div>`,`<button class="btn btn-secondary" onclick="closeModal()">ปิด</button>`)}
async function renderClasses(){const r=await api('getClasses',{filters:{search:state.search,page:state.page,pageSize:state.pageSize}});const a=r.items||r||[];document.getElementById('content').innerHTML=toolbar('การจัดชั้นเรียน',`${searchBar('ค้นหาระดับชั้น / ห้อง')} ${canWrite(['ADMIN','ACADEMIC_AFFAIRS','REGISTRAR'])?`<button class="btn btn-primary" onclick="classForm()"><i class="fa-solid fa-plus"></i> เพิ่มห้องเรียน</button>`:''}`)+`<div class="panel"><div class="panel-body">${tableFromObjects(a,['academicYear','level','room','className','homeroomTeacherId','capacity','status'],false)}</div>${pagination(r)}</div>`}
function pagination(r){const total=Number(r?.total||0),pages=Math.max(1,Math.ceil(total/state.pageSize));if(pages<=1)return '';return `<div class="pagination">${Array.from({length:Math.min(pages,10)},(_,i)=>`<button class="${state.page===i+1?'active':''}" onclick="state.page=${i+1};navigate(state.route)">${i+1}</button>`).join('')}</div>`}
async function classForm(){const teachers=await api('getTeachers',{filters:{page:1,pageSize:500}});modalForm('เพิ่มห้องเรียน',[{name:'academicYear',label:'ปีการศึกษา',required:true},{name:'level',label:'ระดับชั้น',required:true},{name:'room',label:'ห้อง',required:true},{name:'className',label:'ชื่อห้อง'},{name:'homeroomTeacherId',label:'ครูที่ปรึกษา',type:'select',options:(teachers.items||teachers||[]).map(x=>({value:x.teacherId,label:(x.title||'')+' '+x.firstName+' '+x.lastName}))},{name:'capacity',label:'จำนวนนักเรียนสูงสุด',type:'number'},{name:'status',label:'สถานะ',type:'select',options:['ACTIVE','INACTIVE']}],{},async d=>api('saveClass',{data:d}))}
async function renderStudentHistory(){const students=await api('getStudents',{filters:{page:1,pageSize:500}});const list=students.items||students||[];const sid=state.filters.studentId||'';document.getElementById('content').innerHTML=toolbar('ประวัติการศึกษา',`<button class="btn btn-secondary" onclick="navigate('students')"><i class="fa-solid fa-user-graduate"></i> รายชื่อนักเรียน</button>`)+`<div class="filters"><div class="field"><label>นักเรียน</label><select id="historyStudent"><option value="">-- เลือกนักเรียน --</option>${list.map(x=>`<option value="${esc(x.studentId)}" ${sid===x.studentId?'selected':''}>${esc(x.studentNumber+' - '+x.firstName+' '+x.lastName)}</option>`).join('')}</select></div><div class="field" style="align-self:end"><button class="btn btn-primary" onclick="loadHistory()"><i class="fa-solid fa-magnifying-glass"></i> แสดงประวัติ</button></div></div><div id="historyResult"></div>`;if(sid)loadHistory()}

async function renderNotifications(){const a=await api('getNotifications',{});document.getElementById('content').innerHTML=toolbar('แจ้งเตือน',`<button class="btn btn-secondary" onclick="navigate('notifications')"><i class="fa-solid fa-arrows-rotate"></i> รีเฟรช</button>`)+`<div class="panel"><div class="panel-body">${(a||[]).map(x=>`<div class="notice ${x.isRead?'':'warning'}" onclick="markNotification('${esc(x.notificationId)}')"><strong>${esc(x.title)}</strong><div>${esc(x.message)}</div><span class="small">${esc(x.createdAt||'')}</span></div>`).join('')||emptyBox('ไม่มีการแจ้งเตือน')}</div></div>`}
async function markNotification(id){await api('markNotificationRead',{notificationId:id});await navigate('notifications')}
async function renderUsers(){const r=await api('getUsers',{filters:{search:state.search,page:state.page,pageSize:state.pageSize},hideSensitive:true});const a=r.items||r||[];document.getElementById('content').innerHTML=toolbar('ผู้ใช้งานและสิทธิ์',`${searchBar('ค้นหา username / ชื่อ')} <button class="btn btn-primary" onclick="userForm()"><i class="fa-solid fa-user-plus"></i> เพิ่มผู้ใช้งาน</button>`)+`<div class="notice info">ผู้ดูแลระบบสามารถเพิ่มบัญชีฝ่ายวิชาการ ผู้บริหาร ครู นักเรียน และผู้ปกครองได้ โดยสิทธิ์จะถูกตรวจสอบที่ API อีกชั้นหนึ่ง</div><div class="panel"><div class="panel-body">${tableFromObjects(a,['username','displayName','role','email','phone','studentId','teacherId','parentId','classId','status','lastLoginAt'],true)}</div>${pagination(r)}</div>`}
function userForm(){modalForm('เพิ่มผู้ใช้งาน',[{name:'username',label:'ชื่อผู้ใช้',required:true},{name:'password',label:'รหัสผ่าน',type:'password',required:true},{name:'displayName',label:'ชื่อแสดงผล',required:true},{name:'role',label:'สิทธิ์',type:'select',required:true,options:Object.keys(ROLE_LABEL).map(x=>({value:x,label:ROLE_LABEL[x]}))},{name:'email',label:'อีเมล',type:'email'},{name:'phone',label:'โทรศัพท์'},{name:'studentId',label:'รหัสนักเรียน'},{name:'teacherId',label:'รหัสครู'},{name:'parentId',label:'รหัสผู้ปกครอง'},{name:'classId',label:'รหัสห้อง'},{name:'status',label:'สถานะ',type:'select',options:['ACTIVE','INACTIVE']}],{status:'ACTIVE'},async d=>api('saveUser',{data:d}))}
async function renderSettings(){const s=state.settings||await api('getSettings');state.settings=s;document.getElementById('content').innerHTML=toolbar('ตั้งค่าระบบ',`${allowed(['ADMIN'])?`<button class="btn btn-primary" onclick="saveSettingsForm()"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>`:''}`)+`<div class="panel"><div class="panel-head"><h3>ข้อมูลโรงเรียนและเอกสาร</h3></div><div class="panel-body"><div class="form-grid" id="settingsForm">${settingInput('schoolName','ชื่อโรงเรียน',s.schoolName)}${settingInput('address','ที่อยู่',s.address,true)}${settingInput('phone','โทรศัพท์',s.phone)}${settingInput('website','เว็บไซต์',s.website)}${settingInput('logoUrl','โลโก้โรงเรียน',s.logoUrl)}${settingInput('schoolSealUrl','ตราโรงเรียน',s.schoolSealUrl)}${settingInput('currentAcademicYear','ปีการศึกษา',s.currentAcademicYear)}${settingInput('currentTerm','ภาคเรียน',s.currentTerm)}${settingInput('principalName','ชื่อผู้บริหาร',s.principalName)}${settingInput('registrarName','ชื่อนายทะเบียน',s.registrarName)}${settingInput('principalSignatureUrl','ลายเซ็นผู้บริหาร',s.principalSignatureUrl)}${settingInput('registrarSignatureUrl','ลายเซ็นนายทะเบียน',s.registrarSignatureUrl)}${settingInput('teacherSignatureUrl','ลายเซ็นครูผู้สอน',s.teacherSignatureUrl)}${settingInput('documentPrefix','คำนำหน้าเลขที่เอกสาร',s.documentPrefix)}${settingInput('nextDocumentNumber','เลขเอกสารถัดไป',s.nextDocumentNumber,'',true)}</div></div></div><div class="panel"><div class="panel-head"><h3>เครื่องมือระบบ</h3></div><div class="panel-body"><button class="btn btn-warning" onclick="setupSystem()"><i class="fa-solid fa-database"></i> ตรวจสอบ/สร้างหัวตารางฐานข้อมูล</button> <button class="btn btn-secondary" onclick="changePasswordForm()"><i class="fa-solid fa-key"></i> เปลี่ยนรหัสผ่าน</button></div></div>`}
function settingInput(n,l,v,full=false,disabled=false){return `<div class="field ${full===true?'full':''}"><label>${esc(l)}</label><input data-setting="${esc(n)}" value="${esc(v)}" ${disabled?'disabled':''}></div>`}
async function saveSettingsForm(){const data={};document.querySelectorAll('[data-setting]').forEach(x=>data[x.dataset.setting]=x.value);try{state.settings=await api('saveSettings',{data});toast('บันทึกการตั้งค่าแล้ว','success');await renderSettings()}catch(e){toast(e.message,'error')}}
async function setupSystem(){try{const r=await api('setupSystem',{});toast(r.message||'สร้างระบบสำเร็จ','success');await loadSettings()}catch(e){toast(e.message,'error')}}
function changePasswordForm(){modalForm('เปลี่ยนรหัสผ่าน',[{name:'oldPassword',label:'รหัสผ่านเดิม',type:'password',required:true},{name:'newPassword',label:'รหัสผ่านใหม่',type:'password',required:true},{name:'confirmPassword',label:'ยืนยันรหัสผ่านใหม่',type:'password',required:true}],{},async d=>{if(d.newPassword!==d.confirmPassword)throw new Error('รหัสผ่านใหม่ไม่ตรงกัน');await api('changePassword',{oldPassword:d.oldPassword,newPassword:d.newPassword})})}
function printElement(id){const el=document.getElementById(id);if(!el)return;const w=window.open('','_blank');w.document.write(`<html><head><title>ARAMS</title><style>body{font-family:'TH Sarabun New',Tahoma,sans-serif;font-size:18px;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:6px;text-align:left}h1,h2,h3{color:#17365d}</style></head><body>${el.innerHTML}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
window.addEventListener('error',e=>console.error(e.error||e.message));
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast(e.reason?.message||'เกิดข้อผิดพลาด','error')});
boot();
</script>
</body>
</html>
