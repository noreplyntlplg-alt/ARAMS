<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <meta name="description" content="SchooLNext ระบบตรวจสอบและบันทึกผลการเรียน">
    <title>SchooLNext | ระบบตรวจสอบและบันทึกผลการเรียน</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9vQ7pX2C7hW5pM4F1gF2lR3n8qv0j8y1x0p3Vh5u0k7pJ3pK3t3vK5xJ2q1w2x2y1w=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* =========================================================
           SchooLNext
           Global CSS
           ========================================================= */

        :root {
            --primary: #1f2937;
            --primary-dark: #111827;
            --primary-light: #374151;

            --secondary: #2563eb;
            --secondary-dark: #1d4ed8;
            --secondary-light: #eff6ff;

            --success: #15803d;
            --success-light: #f0fdf4;

            --danger: #dc2626;
            --danger-light: #fef2f2;

            --warning: #d97706;
            --warning-light: #fffbeb;

            --info: #0369a1;
            --info-light: #f0f9ff;

            --white: #ffffff;
            --black: #111111;

            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;

            --sidebar-width: 270px;
            --header-height: 68px;

            --radius: 8px;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                "TH Sarabun PSK",
                "TH Sarabun New",
                "Sarabun",
                Arial,
                sans-serif;
            font-size: 21px;
            background: var(--gray-100);
            color: var(--gray-800);
            min-height: 100vh;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .text-left {
            text-align: left;
        }

        .mt-1 {
            margin-top: 8px;
        }

        .mt-2 {
            margin-top: 15px;
        }

        .mt-3 {
            margin-top: 25px;
        }

        .mb-1 {
            margin-bottom: 8px;
        }

        .mb-2 {
            margin-bottom: 15px;
        }

        .mb-3 {
            margin-bottom: 25px;
        }

        .w-100 {
            width: 100%;
        }

        /* =========================================================
           Login
           ========================================================= */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #f3f4f6 0%,
                    #ffffff 50%,
                    #e5e7eb 100%
                );
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            padding: 38px 34px;
            border: 1px solid var(--gray-200);
        }

        .login-logo {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: var(--primary);
            color: #ffffff;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 5px 20px rgba(31, 41, 55, 0.18);
        }

        .login-title {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: var(--primary);
            line-height: 1.1;
        }

        .login-subtitle {
            text-align: center;
            color: var(--gray-500);
            font-size: 22px;
            margin-top: 5px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--gray-700);
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            min-height: 46px;
            padding: 7px 13px;
            border: 1px solid var(--gray-300);
            border-radius: 7px;
            background: #ffffff;
            color: var(--gray-800);
            outline: none;
            transition: 0.2s;
        }

        .form-control:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--gray-500);
            padding: 4px 6px;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0 20px;
            font-size: 20px;
        }

        .remember-row input {
            width: 18px;
            height: 18px;
        }

        .btn {
            border: 0;
            border-radius: 7px;
            padding: 8px 17px;
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-blue {
            background: var(--secondary);
            color: #ffffff;
        }

        .btn-blue:hover {
            background: var(--secondary-dark);
        }

        .btn-success {
            background: var(--success);
            color: #ffffff;
        }

        .btn-danger {
            background: var(--danger);
            color: #ffffff;
        }

        .btn-warning {
            background: var(--warning);
            color: #ffffff;
        }

        .btn-info {
            background: var(--info);
            color: #ffffff;
        }

        .btn-light {
            background: var(--gray-100);
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }

        .btn-outline {
            background: #ffffff;
            color: var(--primary);
            border: 1px solid var(--gray-300);
        }

        .btn-sm {
            min-height: 34px;
            padding: 5px 10px;
            font-size: 18px;
        }

        .btn-lg {
            min-height: 48px;
            padding: 9px 20px;
            font-size: 23px;
        }

        .login-btn {
            width: 100%;
        }

        /* =========================================================
           Application Layout
           ========================================================= */

        #appPage {
            display: none;
            min-height: 100vh;
        }

        #appPage.active {
            display: flex;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--primary);
            color: #ffffff;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease;
            overflow-y: auto;
        }

        .sidebar-brand {
            min-height: var(--header-height);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 11px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-text {
            line-height: 1.05;
        }

        .brand-name {
            font-size: 25px;
            font-weight: bold;
        }

        .brand-subtitle {
            font-size: 17px;
            opacity: 0.72;
        }

        .sidebar-user {
            padding: 16px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .sidebar-user-name {
            font-weight: bold;
            font-size: 21px;
        }

        .sidebar-user-role {
            font-size: 17px;
            opacity: 0.72;
        }

        .sidebar-nav {
            padding: 12px 9px;
            flex: 1;
        }

        .nav-section-title {
            color: rgba(255,255,255,0.46);
            font-size: 17px;
            padding: 9px 11px 5px;
            font-weight: bold;
        }

        .nav-item {
            margin-bottom: 3px;
        }

        .nav-link {
            width: 100%;
            min-height: 42px;
            padding: 7px 11px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 7px;
            border: 0;
            background: transparent;
            color: rgba(255,255,255,0.84);
            text-align: left;
            font-weight: bold;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
        }

        .nav-link.active {
            background: rgba(255,255,255,0.14);
            color: #ffffff;
        }

        .nav-link i {
            width: 22px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .logout-side-btn {
            width: 100%;
            background: rgba(220,38,38,0.15);
            color: #fecaca;
            border: 1px solid rgba(248,113,113,0.18);
        }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            width: calc(100% - var(--sidebar-width));
        }

        .topbar {
            height: var(--header-height);
            background: #ffffff;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-menu-btn {
            display: none;
            width: 40px;
            height: 40px;
            border: 1px solid var(--gray-200);
            border-radius: 7px;
            background: #ffffff;
            color: var(--gray-700);
        }

        .page-title {
            font-weight: bold;
            font-size: 27px;
            color: var(--primary);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-700);
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--gray-100);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--gray-200);
        }

        .content {
            padding: 24px;
        }

        /* =========================================================
           Cards
           ========================================================= */

        .card {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .card-header {
            padding: 15px 18px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .card-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .card-body {
            padding: 18px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 9px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            background: var(--gray-100);
            color: var(--primary);
        }

        .stat-label {
            font-size: 18px;
            color: var(--gray-500);
        }

        .stat-value {
            font-size: 31px;
            font-weight: bold;
            color: var(--primary);
            line-height: 1;
            margin-top: 3px;
        }

        /* =========================================================
           Tables
           ========================================================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .data-table th,
        .data-table td {
            border: 1px solid var(--gray-200);
            padding: 8px 9px;
            vertical-align: middle;
        }

        .data-table th {
            background: var(--gray-100);
            color: var(--gray-700);
            font-weight: bold;
            white-space: nowrap;
        }

        .data-table tbody tr:hover {
            background: #fafafa;
        }

        .data-table input,
        .data-table select {
            min-height: 36px;
            padding: 3px 7px;
        }

        .score-danger {
            background: #fee2e2 !important;
            color: #991b1b;
        }

        .score-disabled {
            background: var(--gray-200) !important;
            color: var(--gray-500) !important;
            cursor: not-allowed;
        }

        .masked-score {
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* =========================================================
           Toolbar / Filters
           ========================================================= */

        .toolbar {
            display: flex;
            align-items: end;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filter-group {
            min-width: 160px;
            flex: 1;
        }

        .filter-group.small {
            min-width: 120px;
            flex: 0 0 150px;
        }

        .filter-group.large {
            min-width: 220px;
        }

        .toolbar-buttons {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        /* =========================================================
           Badges
           ========================================================= */

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 2px 9px;
            font-size: 17px;
            font-weight: bold;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-info {
            background: #e0f2fe;
            color: #075985;
        }

        .badge-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        /* =========================================================
           Empty / Loading
           ========================================================= */

        .empty-state {
            text-align: center;
            padding: 45px 20px;
            color: var(--gray-500);
        }

        .empty-state i {
            font-size: 45px;
            margin-bottom: 12px;
            color: var(--gray-300);
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(2px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-box {
            background: #ffffff;
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .loading-spinner {
            font-size: 35px;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 10px;
            font-weight: bold;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           Modal
           ========================================================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(17,24,39,0.55);
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 760px;
            max-height: 92vh;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal.modal-lg {
            max-width: 1100px;
        }

        .modal-header {
            padding: 15px 18px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .modal-title {
            font-size: 25px;
            font-weight: bold;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 6px;
            background: var(--gray-100);
            color: var(--gray-600);
        }

        .modal-body {
            padding: 18px;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* =========================================================
           Form Grid
           ========================================================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .form-grid.three {
            grid-template-columns: repeat(3, 1fr);
        }

        .form-grid .full {
            grid-column: 1 / -1;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }

        /* =========================================================
           Score Column Manager
           ========================================================= */

        .score-column-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .score-column-item {
            display: grid;
            grid-template-columns: 1fr 130px 120px 45px;
            align-items: center;
            gap: 8px;
            padding: 9px;
            border: 1px solid var(--gray-200);
            border-radius: 7px;
            background: var(--gray-50);
        }

        /* =========================================================
           Student menu
           ========================================================= */

        .student-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .student-info-card {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 13px;
        }

        .student-info-label {
            color: var(--gray-500);
            font-size: 17px;
        }

        .student-info-value {
            font-size: 23px;
            font-weight: bold;
        }

        /* =========================================================
           Appeal
           ========================================================= */

        .appeal-status {
            font-weight: bold;
        }

        .appeal-detail {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 7px 15px;
        }

        .appeal-detail-label {
            color: var(--gray-500);
        }

        /* =========================================================
           Mobile
           ========================================================= */

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 999;
        }

        @media (max-width: 1100px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .student-summary {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {
            :root {
                --sidebar-width: 270px;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .main-wrapper {
                margin-left: 0;
                width: 100%;
            }

            .mobile-menu-btn {
                display: block;
            }

            .content {
                padding: 14px;
            }

            .topbar-user-name {
                display: none;
            }

            .form-grid,
            .form-grid.three {
                grid-template-columns: 1fr;
            }

            .form-grid .full {
                grid-column: auto;
            }

            .score-column-item {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            body {
                font-size: 19px;
            }

            .login-card {
                padding: 28px 20px;
            }

            .login-title {
                font-size: 30px;
            }

            .dashboard-grid,
            .student-summary {
                grid-template-columns: 1fr;
            }

            .page-title {
                font-size: 23px;
            }

            .card-header {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         LOGIN PAGE
         ========================================================= -->

    <section id="loginPage">

        <div class="login-wrapper">

            <div class="login-card">

                <div class="login-logo">
                    <i class="fa-solid fa-school"></i>
                </div>

                <div class="login-title">
                    SchooLNext
                </div>

                <div class="login-subtitle">
                    ระบบตรวจสอบและบันทึกผลการเรียน
                </div>

                <form id="loginForm">

                    <div class="form-group">

                        <label class="form-label">
                            <i class="fa-solid fa-user"></i>
                            ชื่อผู้ใช้
                        </label>

                        <input
                            type="text"
                            id="loginUsername"
                            class="form-control"
                            autocomplete="username"
                            required

    <!-- =========================================================

    <script>

        /* =========================================================
           CONFIGURATION
           ========================================================= */

        const API_URL =
            "https://script.google.com/macros/s/AKfycbwvhaqM3omMeSUgSqFyBNNjh48tzIWX8fdTTynt3r0dL8g7SSKcRDdtX5AZVObeh3tFYA/exec";

        const STORAGE_TOKEN =
            "SCHOOLNEXT_TOKEN";

        const STORAGE_USER =
            "SCHOOLNEXT_USER";

        const STORAGE_REMEMBER =
            "SCHOOLNEXT_REMEMBER";


        /* =========================================================
           GLOBAL STATE
           ========================================================= */

        const state = {

            token: null,

            user: null,

            role: null,

            permissions: {},

            currentPage: "dashboard",

            dashboard: {},

            subjects: [],

            students: [],

            classes: [],

            teachers: [],

            assignments: [],

            scoreColumns: [],

            scores: [],

            scoreVisibility: [],

            gradeRules: [],

            appeals: [],

            settings: {},

            reports: {},

            currentTeacherScoreContext: null,

            currentStudentScoreContext: null,

            importedStudents: []

        };


        /* =========================================================
           DOM HELPERS
           ========================================================= */

        function $(selector) {
            return document.querySelector(selector);
        }

        function $all(selector) {
            return document.querySelectorAll(selector);
        }


        /* =========================================================
           LOADING
           ========================================================= */

        function showLoading(text = "กำลังดำเนินการ...") {

            $("#loadingText").textContent = text;

            $("#loadingOverlay").classList.add("active");

        }

        function hideLoading() {

            $("#loadingOverlay").classList.remove("active");

        }


        /* =========================================================
           ALERT
           ========================================================= */

        function alertSuccess(message) {

            return Swal.fire({
                icon: "success",
                title: "ดำเนินการสำเร็จ",
                text: message || "ดำเนินการเรียบร้อยแล้ว",
                confirmButtonText: "ตกลง",
                confirmButtonColor: "#1f2937"
            });

        }

        function alertError(message) {

            return Swal.fire({
                icon: "error",
                title: "เกิดข้อผิดพลาด",
                text: message || "ไม่สามารถดำเนินการได้",
                confirmButtonText: "ตกลง",
                confirmButtonColor: "#1f2937"
            });

        }

        function alertWarning(message) {

            return Swal.fire({
                icon: "warning",
                title: "แจ้งเตือน",
                text: message,
                confirmButtonText: "ตกลง",
                confirmButtonColor: "#1f2937"
            });

        }


        /* =========================================================
           ESCAPE HTML
           ========================================================= */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================================
           API REQUEST
           ========================================================= */

        async function api(action, payload = {}, options = {}) {

            const showLoader =
                options.loading !== false;

            const loadingText =
                options.loadingText || "กำลังเชื่อมต่อฐานข้อมูล...";

            if (showLoader) {
                showLoading(loadingText);
            }

            try {

                const requestBody = {

                    action: action,

                    token: state.token || "",

                    ...payload

                };

                const response = await fetch(
                    API_URL,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8"
                        },
                        body: JSON.stringify(requestBody),
                        redirect: "follow"
                    }
                );

                const text = await response.text();

                let result;

                try {

                    result = JSON.parse(text);

                } catch (parseError) {

                    throw new Error(
                        "เซิร์ฟเวอร์ส่งข้อมูลกลับมาไม่ใช่ JSON"
                    );

                }

                if (
                    result &&
                    result.success === false
                ) {

                    if (
                        result.message &&
                        (
                            result.message.includes("หมดอายุ") ||
                            result.message.includes("session") ||
                            result.message.includes("token") ||
                            result.code === "UNAUTHORIZED"
                        )
                    ) {

                        await forceLogout(
                            "เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่"
                        );

                    }

                    throw new Error(
                        result.message ||
                        "ไม่สามารถดำเนินการได้"
                    );

                }

                return result;

            } catch (error) {

                console.error(
                    "SchooLNext API Error:",
                    action,
                    error
                );

                if (options.showError !== false) {

                    await alertError(
                        error.message ||
                        "ไม่สามารถเชื่อมต่อระบบได้"
                    );

                }

                throw error;

            } finally {

                if (showLoader) {
                    hideLoading();
                }

            }

        }


        /* =========================================================
           API DATA NORMALIZER
           ========================================================= */

        function getData(result) {

            if (!result) {
                return null;
            }

            if (
                Object.prototype.hasOwnProperty.call(
                    result,
                    "data"
                )
            ) {
                return result.data;
            }

            return result;

        }

        function getArray(data, keys = []) {

            if (Array.isArray(data)) {
                return data;
            }

            if (!data || typeof data !== "object") {
                return [];
            }

            for (const key of keys) {

                if (Array.isArray(data[key])) {
                    return data[key];
                }

            }

            return [];

        }


        /* =========================================================
           STORAGE
           ========================================================= */

        function saveSession() {

            if (!state.token || !state.user) {
                return;
            }

            localStorage.setItem(
                STORAGE_TOKEN,
                state.token
            );

            localStorage.setItem(
                STORAGE_USER,
                JSON.stringify(state.user)
            );

            localStorage.setItem(
                STORAGE_REMEMBER,
                "1"
            );

        }

        function clearSession() {

            localStorage.removeItem(
                STORAGE_TOKEN
            );

            localStorage.removeItem(
                STORAGE_USER
            );

            localStorage.removeItem(
                STORAGE_REMEMBER
            );

        }


        /* =========================================================
           LOGIN
           ========================================================= */

        async function login(username, password, remember) {

            const result = await api(
                "login",
                {
                    username: username,
                    password: password
                },
                {
                    loadingText: "กำลังเข้าสู่ระบบ..."
                }
            );

            const data =
                getData(result) || {};

            state.token =
                data.token ||
                result.token ||
                null;

            state.user =
                data.user ||
                result.user ||
                null;

            state.permissions =
                data.permissions ||
                result.permissions ||
                {};

            if (!state.token || !state.user) {

                throw new Error(
                    "ระบบไม่พบข้อมูลเซสชันหลังเข้าสู่ระบบ"
                );

            }

            state.role =
                normalizeRole(
                    state.user.role ||
                    state.user.userRole ||
                    state.user.type
                );

            if (remember) {

                saveSession();

            } else {

                sessionStorage.setItem(
                    STORAGE_TOKEN,
                    state.token
                );

                sessionStorage.setItem(
                    STORAGE_USER,
                    JSON.stringify(state.user)
                );

                localStorage.removeItem(
                    STORAGE_TOKEN
                );

                localStorage.removeItem(
                    STORAGE_USER
                );

                localStorage.removeItem(
                    STORAGE_REMEMBER
                );

            }

            await enterApplication();

        }


        function normalizeRole(role) {

            const value =
                String(role || "")
                    .trim()
                    .toLowerCase();

            if (
                value === "admin" ||
                value === "manager" ||
                value === "ผู้จัดการระบบ" ||
                value === "ผู้ดูแลระบบ"
            ) {
                return "manager";
            }

            if (
                value === "teacher" ||
                value === "ครู" ||
                value === "คุณครู"
            ) {
                return "teacher";
            }

            if (
                value === "student" ||
                value === "นักเรียน"
            ) {
                return "student";
            }

            return value;

        }


        /* =========================================================
           SESSION RESTORE
           ========================================================= */

        async function restoreSession() {

            let token =
                localStorage.getItem(
                    STORAGE_TOKEN
                );

            let userText =
                localStorage.getItem(
                    STORAGE_USER
                );

            if (!token) {

                token =
                    sessionStorage.getItem(
                        STORAGE_TOKEN
                    );

                userText =
                    sessionStorage.getItem(
                        STORAGE_USER
                    );

            }

            if (!token) {
                return false;
            }

            state.token = token;

            try {

                const result =
                    await api(
                        "getSession",
                        {},
                        {
                            loading: false,
                            showError: false
                        }
                    );

                const data =
                    getData(result) || {};

                if (
                    data.user ||
                    result.user
                ) {

                    state.user =
                        data.user ||
                        result.user;

                } else if (userText) {

                    state.user =
                        JSON.parse(userText);

                }

                state.permissions =
                    data.permissions ||
                    result.permissions ||
                    {};

                state.role =
                    normalizeRole(
                        state.user &&
                        (
                            state.user.role ||
                            state.user.userRole ||
                            state.user.type
                        )
                    );

                if (!state.user) {
                    throw new Error("ไม่พบข้อมูลผู้ใช้");
                }

                await enterApplication();

                return true;

            } catch (error) {

                clearSession();

                state.token = null;
                state.user = null;
                state.role = null;

                return false;

            }

        }


        /* =========================================================
           ENTER APPLICATION
           ========================================================= */

        async function enterApplication() {

            $("#loginPage").style.display = "none";

            $("#appPage").classList.add("active");

            updateUserUI();

            buildMenuByRole();

            await navigateTo(
                getDefaultPage()
            );

        }


        function getDefaultPage() {

            if (state.role === "manager") {
                return "dashboard";
            }

            if (state.role === "teacher") {
                return "teacherScores";
            }

            if (state.role === "student") {
                return "studentGrades";
            }

            return "dashboard";

        }


        function updateUserUI() {

            const name =
                state.user &&
                (
                    state.user.name ||
                    state.user.fullName ||
                    state.user.displayName ||
                    state.user.username
                );

            const roleText =
                getRoleLabel(
                    state.role
                );

            $("#sidebarUserName").textContent =
                name || "-";

            $("#sidebarUserRole").textContent =
                roleText;

            $("#topbarUserName").textContent =
                name || "-";

        }


        function getRoleLabel(role) {

            if (role === "manager") {
                return "ผู้จัดการระบบ";
            }

            if (role === "teacher") {
                return "คุณครู";
            }

            if (role === "student") {
                return "นักเรียน";
            }

            return "ผู้ใช้งาน";

        }


        /* =========================================================
           MENU BY ROLE
           ========================================================= */

        function buildMenuByRole() {

            $all("[data-role]").forEach(
                section => {

                    const role =
                        section.dataset.role;

                    section.style.display =
                        role === state.role
                            ? ""
                            : "none";

                }
            );

        }


        /* =========================================================
           LOGOUT
           ========================================================= */

        async function logout() {

            const confirmed =
                await Swal.fire({
                    icon: "question",
                    title: "ออกจากระบบ?",
                    text: "คุณต้องการออกจากระบบใช่หรือไม่",
                    showCancelButton: true,
                    confirmButtonText: "ออกจากระบบ",
                    cancelButtonText: "ยกเลิก",
                    confirmButtonColor: "#dc2626"
                });

            if (!confirmed.isConfirmed) {
                return;
            }

            try {

                if (state.token) {

                    await api(
                        "logout",
                        {},
                        {
                            loading: true,
                            loadingText: "กำลังออกจากระบบ...",
                            showError: false
                        }
                    );

                }

            } catch (error) {

                console.warn(
                    "Logout API:",
                    error
                );

            }

            resetApplication();

        }


        async function forceLogout(message) {

            clearSession();

            resetApplication();

            if (message) {
                await alertWarning(message);
            }

        }


        function resetApplication() {

            state.token = null;
            state.user = null;
            state.role = null;
            state.permissions = {};

            $("#appPage").classList.remove("active");

            $("#loginPage").style.display = "flex";

            $("#loginUsername").value = "";
            $("#loginPassword").value = "";
            $("#rememberLogin").checked = false;

            closeModal();

            $("#sidebar").classList.remove("open");
            $("#sidebarOverlay").classList.remove("active");

        }


        /* =========================================================
           NAVIGATION
           ========================================================= */

        const PAGE_TITLES = {

            dashboard: "หน้าหลัก",

            subjects: "จัดการรายวิชา",

            students: "ทะเบียนนักเรียน",

            classes: "ระดับชั้น",

            teachers: "ทะเบียนคุณครู",

            assignments: "มอบหมายภาระงาน",

            teacherSettings: "ตั้งค่าระบบคุณครู",

            studentSettings: "ตั้งค่าระบบนักเรียน",

        async function navigateTo(page) {

            if (!PAGE_TITLES[page]) {
                page = getDefaultPage();
            }

            if (!isPageAllowed(page)) {

                await alertWarning(
                    "คุณไม่มีสิทธิ์เข้าถึงเมนูนี้"
                );

                return;

            }

            state.currentPage = page;

            $("#pageTitle").textContent =
                PAGE_TITLES[page];

            $all(".nav-link").forEach(
                button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.page === page
                    );

                }
            );

            $("#sidebar").classList.remove("open");
            $("#sidebarOverlay").classList.remove("active");

            await renderPage(page);

        }


        function isPageAllowed(page) {

            const managerPages = [
                "dashboard",
                "subjects",
                "students",
                "classes",
                "teachers",
                "assignments",
                "teacherSettings",
                "studentSettings",
                "systemSettings",
                "reports"
            ];

            const teacherPages = [
                "teacherScores",
                "teacherAppeals"
            ];

            const studentPages = [
                "studentGrades",
                "studentScores",
                "studentAppeals"
            ];

            if (page === "dashboard") {
                return true;
            }

            if (
                state.role === "manager" &&
                managerPages.includes(page)
            ) {
                return true;
            }

            if (
                state.role === "teacher" &&
                teacherPages.includes(page)
            ) {
                return true;
            }

            if (
                state.role === "student" &&
                studentPages.includes(page)
            ) {
                return true;
            }

            return false;

        }

        async function saveSubject() {

            const code =
                $("#subjectCode").value.trim();

            const name =
                $("#subjectName").value.trim();

            const category =
                $("#subjectCategory").value;

            const credit =
                $("#subjectCredit").value;

            const level =
                $("#subjectLevel").value.trim();

            const room =
                $("#subjectRoom").value.trim();

            const editIndex =
                $("#subjectEditIndex").value;

            if (
                !code ||
                !name ||
                !category ||
                credit === ""
            ) {

                await alertWarning(
                    "กรุณากรอกข้อมูลรายวิชาให้ครบถ้วน"
                );

                return;

            }

            const payload = {

                subject: {

                    id:
                        editIndex !== ""
                            ? (
                                state.subjects[
                                    Number(editIndex)
                                ]?.id ||
                                state.subjects[
                                    Number(editIndex)
                                ]?.subjectId ||
                                ""
                            )
                            : "",

                    code: code,

                    subjectCode: code,

                    name: name,

                    subjectName: name,

                    category: category,

                    type: category,

                    credit: Number(credit),

                    credits: Number(credit),

                    level: level,

                    gradeLevel: level,

                    room: room,

                    classRoom: room

                }

            };

            try {

                await api(
                    "subjects",
                    {
                        method:
                            editIndex !== ""
                                ? "update"
                                : "create",

                        ...payload

                    },
                    {
                        loadingText:
                            editIndex !== ""
                                ? "กำลังแก้ไขรายวิชา..."
                                : "กำลังเพิ่มรายวิชา..."
                    }
                );

                closeModal();

                await alertSuccess(
                    "บันทึกข้อมูลรายวิชาเรียบร้อยแล้ว"
                );

                await loadSubjects();

            } catch (error) {

            }

        }


        async function deleteSubject(index) {

            const subject =
                state.subjects[index];

            if (!subject) {
                return;
            }

            const confirmed =
                await Swal.fire({
                    icon: "warning",
                    title: "ยืนยันการลบ",
                    text:
                        `ต้องการลบรายวิชา ${
                            subject.name ||
                            subject.subjectName ||
                            ""
                        } ใช่หรือไม่`,
                    showCancelButton: true,
                    confirmButtonText: "ลบข้อมูล",
                    cancelButtonText: "ยกเลิก",
                    confirmButtonColor: "#dc2626"
                });

            if (!confirmed.isConfirmed) {
                return;
            }

            try {

                await api(
                    "subjects",
                    {
                        method: "delete",
                        id:
                            subject.id ||
                            subject.subjectId ||
                            ""
                    },
                    {
                        loadingText: "กำลังลบรายวิชา..."
                    }
                );

                await alertSuccess(
                    "ลบรายวิชาเรียบร้อยแล้ว"
                );

                await loadSubjects();

            } catch (error) {

            }

        }

        async function loadClassesForSelect() {

            try {

                const result =
                    await api(
                        "classes",
                        {},
                        {
                            loading: false,
                            showError: false
                        }
                    );

                const data =
                    getData(result);

                state.classes =
                    getArray(
                        data,
                        [
                            "classes",
                            "items",
                            "rows",
                            "list"
                        ]
                    );

                const select =
                    $("#studentClassFilter");

                if (!select) {
                    return;
                }

                select.innerHTML = `
                    <option value="">
                        ทุกระดับชั้น
                    </option>
                `;

                state.classes.forEach(
                    item => {

                        const value =
                            getClassName(item);

                        if (!value) {
                            return;
                        }

                        select.insertAdjacentHTML(
                            "beforeend",
                            `
                                <option value="${escapeHtml(value)}">
                                    ${escapeHtml(value)}
                                </option>
                            `
                        );

                    }
                );

            } catch (error) {

            }

        }


        function getClassName(item) {

            if (!item) {

        async function handleStudentCsv(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            try {

                const text =
                    await file.text();

                const rows =
                    parseCSV(text);

                if (rows.length < 2) {

                    await alertWarning(
                        "ไฟล์ CSV ไม่มีข้อมูลนักเรียน"
                    );

                    return;

                }

                const headers =
                    rows[0].map(
                        h => h.trim()
                    );

                const expectedHeaders = [
                    "รหัสประจำตัว",
                    "คำนำหน้า",
                    "ชื่อ",
                    "สกุล",
                    "เลขบัตรประจำตัวนักเรียน"
                ];

                const valid =
                    expectedHeaders.every(
                        header =>
                            headers.includes(header)
                    );

                if (!valid) {

                    await alertError(
                        "หัวตาราง CSV ไม่ตรงตามรูปแบบที่ระบบกำหนด"
                    );

                    return;

                }

                state.importedStudents =
                    rows
                        .slice(1)
                        .filter(
                            row =>
                                row.some(
                                    value =>
                                        String(value).trim() !== ""
                                )
                        )
                        .map(
                            row => {

                                const item = {};

                                headers.forEach(
                                    (
                                        header,
                                        index
                                    ) => {

                                        item[header] =
                                            row[index] ||
                                            "";

                                    }
                                );

                                return {

                                    studentId:
                                        item["รหัสประจำตัว"] ||
                                        "",

                                    prefix:
                                        item["คำนำหน้า"] ||
                                        "",

                                    firstName:
                                        item["ชื่อ"] ||
                                        "",

                                    lastName:
                                        item["สกุล"] ||
                                        "",

                                    citizenId:
                                        item["เลขบัตรประจำตัวนักเรียน"] ||
                                        "",

                                    className: ""

                                };

                            }
                        );

                renderImportedStudentsPreview();

            } catch (error) {

                await alertError(
                    "ไม่สามารถอ่านไฟล์ CSV ได้"
                );

            }

        }


        function parseCSV(text) {

            const rows = [];

            let row = [];

            let value = "";

            let insideQuotes = false;

            for (
                let i = 0;
                i < text.length;
                i++
            ) {

                const char =
                    text[i];

                const next =
                    text[i + 1];

                if (char === '"') {

                    if (
                        insideQuotes &&
                        next === '"'
                    ) {

                        value += '"';

                        i++;

                    } else {

                        insideQuotes =
                            !insideQuotes;

                    }

                } else if (
                    char === "," &&
                    !insideQuotes
                ) {

                    row.push(value);

                    value = "";

                } else if (
                    (
                        char === "\n" ||
                        char === "\r"
                    ) &&
                    !insideQuotes
                ) {

                    if (
                        char === "\r" &&
                        next === "\n"
                    ) {
                        i++;
                    }

                    row.push(value);

                    rows.push(row);

                    row = [];

                    value = "";

                } else {

                    value += char;

                }

            }

            if (
                value !== "" ||
                row.length > 0
            ) {

                row.push(value);

                rows.push(row);

            }

            return rows;

        }

        async function saveImportedStudents() {

            if (
                !state.importedStudents.length
            ) {

                await alertWarning(
                    "ไม่มีข้อมูลนักเรียนสำหรับบันทึก"
                );

                return;

            }

            const missingClass =
                state.importedStudents.some(
                    student =>
                        !student.className
                );

            if (missingClass) {

                await alertWarning(
                    "กรุณาเลือกระดับชั้น/ห้องให้นักเรียนทุกคนก่อนบันทึก"
                );

                return;

                    editIndex !== ""
                        ? (

                            ]?.id ||

                !teacher.name ||

                await alertWarning(
                    "กรุณากรอกข้อมูลคุณครูให้ครบถ้วน"

                );

                return;

            try {

                                ? "update"

                            item.teacherId ||
                            item.username ||
                            ""
                        ) === String(id || "")
                );

            return teacher
                ? (
                    teacher.name ||
                    teacher.fullName ||
                    ""
                )
                : "";

        }


        function findSubjectName(id) {

            const subject =
                state.subjects.find(
                    item =>
                        String(
                            item.id ||
                            item.subjectId ||
                            item.code ||
                            ""
                        ) === String(id || "")
                );

            return subject
                ? (
                    subject.name ||
                    subject.subjectName ||
                    ""
                )
                : "";

            const item =
                state.classes.find(

                );

            return item

            const teacherId =

            const classId =
                $("#assignmentClass").value;

            if (
                !teacherId ||

                !classId

                    "กรุณาเลือกคุณครู รายวิชา และระดับชั้น"

                return;

            try {

        function renderTeacherScoreRow(
            student,
            studentIndex,
            columns
        ) {

            const studentId =
                student.studentId ||
                student.id ||
                student.studentID ||
                "";

            const studentName =
                student.fullName ||
                student.name ||
                [
                    student.prefix || "",
                    student.firstName || "",
                    student.lastName || ""
                ]
                    .join(" ")
                    .trim();

            return `

                <tr
                    data-student-id="${escapeHtml(studentId)}"
                >

                    <td class="text-center">
                        ${
                            student.number ||
                            student.no ||
                            studentIndex + 1
                        }
                    </td>

                    <td>
                        ${escapeHtml(studentName)}
                    </td>

                    ${columns.map(
                        column => {

                            const columnId =
                                column.id ||
                                column.columnId ||
                                column.key ||
                                "";

                            const value =
                                findScoreValue(
                                    student,
                                    columnId
                                );

                            const maxScore =
                                Number(
                                    column.maxScore ??
                                    column.fullScore ??
                                    0
                                );

                            const numericValue =
                                value === ""
                                    ? null
                                    : Number(value);

                            const danger =
                                numericValue !== null &&
                                maxScore > 0 &&
                                numericValue <
                                    maxScore / 2;

                            return `

                                <td
                                    class="${
                                        danger
                                            ? "score-danger"
                                            : ""
                                    }"
                                >

                                    <input
                                        type="number"
                                        step="0.01"
                                        min="0"
                                        max="${escapeHtml(maxScore)}"
                                        class="form-control teacher-score-input"
                                        data-student-id="${escapeHtml(studentId)}"
                                        data-column-id="${escapeHtml(columnId)}"
                                        value="${escapeHtml(
                                            value === null ||
                                            value === undefined
                                                ? ""
                                                : value
                                        )}"
                                        oninput="updateScoreCellStyle(this, ${maxScore})"
                                    >

                                </td>

                            `;

                        }
                    ).join("")}

                    <td
                        class="text-center"
                        data-total-for="${escapeHtml(studentId)}"
                    >
                        ${calculateStudentTotal(
                            student,
                            columns
                        )}
                    </td>

                    <td
                        class="text-center"
                        data-grade-for="${escapeHtml(studentId)}"
                    >
                        ${calculateGrade(
                            calculateStudentTotal(
                                student,
                                columns
                            )
                        )}
                    </td>

                </tr>

            `;

        }


        function findScoreValue(
            student,
            columnId
        ) {

            if (!student) {
                return "";
            }

            const scores =
                student.scores ||
                student.scoreMap ||
                {};

            if (
                Object.prototype.hasOwnProperty.call(
                    scores,
                    columnId
                )
            ) {
                return scores[columnId];
            }

            if (
                Array.isArray(
                    student.scoreList
                )
            ) {

                const item =
                    student.scoreList.find(
                        score =>
                            String(
                                score.columnId ||
                                score.id ||
                                ""
                            ) ===
                            String(columnId)
                    );

                if (item) {
                    return (
                        item.score ??
                        item.value ??
                        ""
                    );
                }

            }

            return "";

        }


        function calculateStudentTotal(
            student,
            columns
        ) {

            let total = 0;

            columns.forEach(
                column => {

                    const value =
                        Number(
                            findScoreValue(
                                student,
                                column.id ||
                                column.columnId ||
                                column.key
                            )
                        );

                    if (
                        Number.isFinite(value)
                    ) {
                        total += value;
                    }

                }
            );

            return Number(
                total.toFixed(2)
            );

        }


        function calculateGrade(total) {

            if (
                !state.gradeRules.length
            ) {
                return "-";
            }

            const rule =
                state.gradeRules.find(
                    item => {

                        const min =
                            Number(
                                item.min ??
                                item.minScore ??
                                0
                            );

                        const max =
                            Number(
                                item.max ??
                                item.maxScore ??
                                0
                            );

                        return (
                            total >= min &&
                            total <= max
                        );

                    }
                );

            return rule
                ? (
                    rule.grade ||
                    "-"
                )
                : "-";

        }


        function updateScoreCellStyle(
            input,
            maxScore
        ) {

            const value =
                Number(input.value);

            const cell =
                input.closest("td");

            if (!cell) {
                return;
            }

            if (
                input.value !== "" &&
                maxScore > 0 &&
                value < maxScore / 2
            ) {

                cell.classList.add(
                    "score-danger"
                );

            } else {

                cell.classList.remove(
                    "score-danger"
                );

            }

        }

        function canProcessAppeal(appeal) {

            const status =
                String(
                    appeal?.status ||
                    ""
                ).toLowerCase();

            return !(
                status === "approved" ||
                status === "rejected" ||
                status.includes("อนุมัติ") ||
                status.includes("ไม่อนุมัติ")
            );

        }


        async function approveAppeal(index) {

            const appeal =
                state.appeals[index];

            if (!appeal) {
                return;
            }

            try {

                await api(
                    "appeals",
                    {
                        method: "approve",

                        id:
                            appeal.id ||
                            appeal.appealId ||
                            ""

                    },
                    {
                        loadingText:
                            "กำลังอนุมัติคำร้อง..."
                    }
                );

                closeModal();

                await alertSuccess(

                );

                await searchTeacherAppeals();

            } catch (error) {

            }

        }


        async function rejectAppeal(index) {

            const appeal =
                state.appeals[index];

            if (!appeal) {
                return;
            }

            const result =
                await Swal.fire({
                    title: "ไม่อนุมัติคำร้อง",
                    input: "textarea",
                    inputLabel: "เหตุผล",
                    inputPlaceholder:
                        "กรอกเหตุผลที่ไม่อนุมัติ",
                    showCancelButton: true,
                    confirmButtonText: "ยืนยัน",
                    cancelButtonText: "ยกเลิก",
                    confirmButtonColor: "#dc2626"
                });

            if (!result.isConfirmed) {
                return;
            }

            try {

                await api(
                    "appeals",
                    {
                        method: "reject",

                        id:
                            appeal.id ||
                            appeal.appealId ||

                        reason:

                );

                await searchTeacherAppeals();

            } catch (error) {

            }

        }

        function getStudentColumnScore(
            scores,
            id
        ) {

            if (
                Array.isArray(scores)
            ) {

                const item =
                    scores.find(
                        score =>
                            String(
                                score.columnId ||
                                score.id ||
                                ""
                            ) ===
                            String(id || "")
                    );

                return item
                    ? (
                        item.score ??
                        item.value ??
                        ""
                    )
                    : "";

            }

            if (
                scores &&
                Object.prototype.hasOwnProperty.call(
                    scores,
                    id
                )
            ) {

                return scores[id];

            }

            return "";

        }


        function isStudentColumnVisible(
            data,
            id
        ) {

            const visible =
                data.visibleColumns ||
                data.scoreVisibility ||
                data.visibility;

            if (
                !visible
            ) {

                return true;

            }

            if (
                Array.isArray(visible)
            ) {

                return visible.some(
                    item => {

                        if (
                            typeof item === "string"
                        ) {
                            return String(item) === String(id);
                        }

                        return (
                            String(
                                item.columnId ||
                                item.id ||
                                ""
                            ) ===
                            String(id || "")
                        ) &&
                        (
                            item.visible !== false
                        );

                    }
                );

            }

            return true;

        }

        async function submitStudentAppeal() {

            const subjectId =
                state.currentStudentScoreContext?.subjectId;

            const columnId =
                $("#appealColumn").value;

            const reason =
                $("#appealReason").value.trim();

            if (
                !columnId ||
                !reason

                await alertWarning(
                    "กรุณาเลือกช่องคะแนนและระบุเหตุผล"
                );

                return;

            }

            let attachment = null;

            const file =
                $("#appealImage")?.files?.[0];

            if (file) {

                if (
                    file.size >
                    5 * 1024 * 1024
                ) {

                    await alertWarning(
                        "ไฟล์รูปภาพต้องมีขนาดไม่เกิน 5 MB"
                    );

                    return;

                }

                attachment =
                    await fileToBase64(
                        file
                    );

            }

            try {

                await api(
                    "appeals",
                    {
                        method: "create",

                        appeal: {

                            subjectId:
                                subjectId,

                            columnId:
                                columnId,

                            reason:
                                reason,

                            attachment:
                                attachment

                        }

                    },
                    {
                        loadingText:
                            "กำลังส่งคำร้อง..."
                    }
                );

                closeModal();

                await alertSuccess(
                    "ส่งคำร้องขอแก้ตัวเรียบร้อยแล้ว"
                );

            } catch (error) {

            }

        }


        function fileToBase64(file) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    const reader =
                        new FileReader();

                    reader.onload =
                        () => {

                            resolve({

                                name:
                                    file.name,

                                type:
                                    file.type,

                                size:
                                    file.size,

                                data:
                                    reader.result

                            });

                        };

                    reader.onerror =
                        reject;

                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }

        function exportRowsToCsv(
            rows,
            filename
        ) {

            if (
                !Array.isArray(rows) ||
                !rows.length
            ) {
                return;
            }

            const headers =
                Object.keys(
                    rows[0]
                );

            const csvRows = [];

            csvRows.push(
                headers
                    .map(
                        value =>
                            csvEscape(value)
                    )
                    .join(",")
            );

            rows.forEach(
                row => {

                    csvRows.push(
                        headers
                            .map(
                                header =>
                                    csvEscape(
                                        row[header] ??
                                        ""
                                    )
                            )
                            .join(",")
                    );

                }
            );

            const blob =
                new Blob(
                    [
                        "\uFEFF" +
                        csvRows.join("\n")
                    ],
                    {
                        type:
                            "text/csv;charset=utf-8;"
                    }
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;

            a.download =
                `SchooLNext_${filename}.csv`;

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);

        }


        function csvEscape(value) {

            const text =
                String(value ?? "");

            if (
                text.includes(",") ||
                text.includes('"') ||
                text.includes("\n")
            ) {

                return (
                    '"' +
                    text.replace(
                        /"/g,
                        '""'
                    ) +
                    '"'
                );

            }

            return text;

        }


        /* =========================================================

        function toDateTimeLocal(value) {

            if (!value) {
                return "";
            }

            const date =
                new Date(value);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return String(value)
                    .slice(0, 16);

            }

            const pad =
                number =>
                    String(number)
                        .padStart(2, "0");

            return (
                date.getFullYear() +
                "-" +
                pad(
                    date.getMonth() + 1
                ) +
                "-" +
                pad(
                    date.getDate()
                ) +
                "T" +
                pad(
                    date.getHours()
                ) +
                ":" +
                pad(
                    date.getMinutes()
                )
            );

        }

                        ) {

                            closeModal();

                        }

                    }
                );


                await restoreSession();

            }
        );


        /* =========================================================
           INITIAL DEFAULT LOGIN
           ========================================================= */

        window.addEventListener(
            "beforeunload",
            function () {

                /*
                 * ไม่ทำ logout อัตโนมัติ
                 * เพื่อให้ session สามารถกลับมาใช้งานได้
                 * ตามระบบจดจำการเข้าสู่ระบบ
                 */

            }
        );


        /* =========================================================
           GLOBAL ERROR HANDLERS
           ========================================================= */

        window.addEventListener(
            "unhandledrejection",
            function (event) {

                console.error(
                    "Unhandled Promise:",
                    event.reason
                );

            }
        );


        window.addEventListener(
            "error",
            function (event) {

                console.error(
                    "Frontend Error:",
                    event.error
                );

            }
        );


        /* =========================================================
           DEBUG API
           ========================================================= */

        window.SchooLNext = {

            state: state,

            api: api,

            navigateTo: navigateTo,

            logout: logout,

            reload:
                function () {

                    return renderPage(
                        state.currentPage
                    );

                }

        };

    </script>

</body>
                       </html>
